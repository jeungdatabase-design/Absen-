r-guru\"\n            onClick={() => {\n              onBulkStamp(activeTeacherIds, 'hadir');\n              onShowToast(`Guru (${activeTeacherIds.length}) ditandai Hadir`);\n            }}\n            className=\"flex-1 sm:flex-none text-xs font-semibold bg-[#1F7A4C] text-white px-3 py-1.5 rounded-lg hover:bg-[#19633e] transition flex items-center justify-center gap-1.5 shadow-2xs\"\n          >\n            <CheckCheck className=\"w-3.5 h-3.5\" />\n            <span>Tandai Hadir Hari Ini</span>\n          </button>\n          <button\n            id=\"btn-reset-absen-guru\"\n            onClick={() => {\n              if (confirm('Reset semua status absensi Guru tanggal ini?')) {\n                onResetAttendance(activeTeacherIds);\n                onShowToast('Absen Guru di-reset');\n              }\n            }}\n            title=\"Reset Absen Guru\"\n            className=\"text-xs text-[#5B6B7A] bg-white border border-[#E1DACB] p-1.5 rounded-lg hover:text-[#C23B3B] hover:border-[#C23B3B] transition\"\n          >\n            <RefreshCw className=\"w-3.5 h-3.5\" />\n          </button>\n        </div>\n      </div>\n\n      {/* Search Bar */}\n      {roster.teachers.length > 3 && (\n        <div className=\"relative\">\n          <Search className=\"w-4 h-4 absolute left-3 top-2.5 text-[#5B6B7A]\" />\n          <input\n            type=\"text\"\n            placeholder=\"Cari nama guru, NIP, atau mata pelajaran...\"\n            value={searchQuery}\n            onChange={(e) => setSearchQuery(e.target.value)}\n            className=\"w-full bg-white border border-[#EDE8DC] rounded-xl pl-9 pr-3 py-2 text-xs text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n          />\n        </div>\n      )}\n\n\n      {/* Ledger Table */}\n      <div className=\"space-y-1\">\n        {filteredTeachers.length === 0 ? (\n          <div className=\"py-10 text-center text-[#5B6B7A] text-sm bg-white border border-[#EDE8DC] rounded-xl p-6\">\n            <p className=\"font-semibold text-[#22303F]\">Tidak ada guru berjadwal mengajar pada hari {currentDayName}.</p>\n            <p className=\"text-xs text-[#5B6B7A] mt-1\">Hilangkan centang \"Jadwal {currentDayName}\" di atas untuk melihat guru lainnya.</p>\n          </div>\n        ) : (\n          filteredTeachers.map((teacher, idx) => {\n            const att = attendanceMap[teacher.id];\n\n            return (\n              <div\n                key={teacher.id}\n                className={`py-2.5 border-b border-dashed border-[#E7E1D2] flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:bg-[#F5F0E6]/30 px-2 rounded-lg transition ${\n                  teacher.jadwalPiket?.includes(currentDayName) ? 'bg-[#F0F7FF]/50 border-l-4 border-l-[#2B6CB0]' : ''\n                }`}\n              >\n                {/* Info Guru */}\n                <div className=\"flex items-center gap-2.5 min-w-0\">\n                  <span className=\"font-jetbrains text-xs text-[#5B6B7A] w-6 font-bold flex-none\">\n                    {String(idx + 1).padStart(2, '0')}\n                  </span>\n                  <div className=\"min-w-0\">\n                    <div className=\"flex flex-wrap items-center gap-1.5\">\n                      <p className=\"font-bold text-sm text-[#22303F] truncate\">{teacher.nama}</p>\n                      {teacher.jadwalPiket?.includes(currentDayName) && (\n                        <span className=\"bg-[#2B6CB0] text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded shadow-2xs flex items-center gap-0.5\">\n                          🛡️ GURU PIKET HARI INI\n                        </span>\n                      )}\n                      {Array.isArray(teacher.jadwalHari) && teacher.jadwalHari.length > 0 && !teacher.jadwalHari.includes(currentDayName) && !teacher.jadwalPiket?.includes(currentDayName) && (\n                        <span className=\"bg-amber-100 text-amber-800 border border-amber-300 text-[10px] font-bold px-1.5 py-0.2 rounded flex items-center gap-0.5\" title={`Tidak ada jadwal mengajar pada hari ${currentDayName}`}>\n                          ⚠️ Tidak Berjadwal {currentDayName}\n                        </span>\n                      )}\n                      {onOpenBarcodeCard && (\n                        <button\n                          onClick={() => onOpenBarcodeCard(teacher)}\n                          className=\"text-[#1F3D2E] hover:bg-[#E4F3EA] p-1 rounded transition cursor-pointer\"\n                          title=\"Lihat Kartu Barcode Guru\"\n                        >\n                          <QrCode className=\"w-3.5 h-3.5\" />\n                        </button>\n                      )}\n                    </div>\n\n                    <div className=\"flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px] text-[#5B6B7A] mt-0.5\">\n                      {teacher.mataPelajaran ? (\n                        <span className=\"font-medium text-[#1F3D2E]\">{teacher.mataPelajaran}</span>\n                      ) : (\n                        <span className=\"italic text-[#8C9BA5]\">Guru / Staf</span>\n                      )}\n                      {teacher.nisNip && <span className=\"font-jetbrains text-[10px]\">({teacher.nisNip})</span>}\n                      {teacher.jadwalPiket && teacher.jadwalPiket.length > 0 && !teacher.jadwalPiket.includes(currentDayName) && (\n                        <span className=\"text-[10px] text-[#2B6CB0] font-semibold bg-[#EBF3FB] px-1 py-0.2 rounded\">\n                          🛡️ Piket: {teacher.jadwalPiket.join(', ')}\n                        </span>\n                      )}\n\n                      {att && (\n                        <span className=\"font-jetbrains text-[10px] bg-[#EDE8DC] px-1.5 py-0.2 rounded text-[#22303F]\">\n                          Jam: {att.jam}\n                        </span>\n                      )}\n                      {att?.keterangan && (\n                        <span className=\"text-[#B5730E] italic truncate max-w-[150px]\">\n                          ({att.keterangan})\n                        </span>\n                      )}\n                    </div>\n                  </div>\n                </div>\n\n                {/* Status Stamps & Note */}\n                <div className=\"flex items-center gap-1 sm:gap-1.5 w-full sm:w-auto justify-between sm:justify-start pt-1 sm:pt-0\">\n                  <div className=\"grid grid-cols-4 gap-1 flex-1 sm:flex-initial\">\n                    {statuses.map((st) => {\n                      const isStamped = att?.status === st.key;\n                      return (\n                        <button\n                          key={st.key}\n                          id={`stamp-guru-${teacher.id}-${st.key}`}\n                          onClick={() => {\n                            const newStatus = isStamped ? null : st.key;\n                            onStampStatus(teacher.id, newStatus);\n                            if (newStatus) {\n                              onShowToast(`${teacher.nama}: ${st.label}`);\n                            } else {\n                              onShowToast('Status dihapus');\n                            }\n                          }}\n                          className={`font-kalam font-bold text-xs py-1.5 sm:py-1 px-1 sm:px-2.5 rounded-md border-2 transition-transform cursor-pointer touch-manipulation min-h-[38px] sm:min-h-0 flex items-center justify-center ${\n                            isStamped\n                              ? `${st.activeClass} stamp-pop shadow-xs -rotate-1 font-extrabold`\n                              : 'bg-[#F4F1E9] text-[#7A7365] border-transparent hover:bg-[#EBE6DA]'\n                          }`}\n                        >\n                          {st.label}\n                        </button>\n                      );\n                    })}\n                  </div>\n\n                  {/* Note trigger */}\n                  <button\n                    onClick={() => {\n                      if (activeNoteInputId === teacher.id) {\n                        setActiveNoteInputId(null);\n                      } else {\n                        setActiveNoteInputId(teacher.id);\n                        setNoteText(att?.keterangan || '');\n                      }\n                    }}\n                    title=\"Tambah / edit keterangan\"\n                    className={`p-2 sm:p-1.5 rounded-md text-xs transition border flex-none min-h-[38px] min-w-[38px] sm:min-h-0 sm:min-w-0 flex items-center justify-center touch-manipulation ${\n                      att?.keterangan\n                        ? 'bg-[#FBF0DD] text-[#B5730E] border-[#B5730E]'\n                        : 'bg-[#F4F1E9] text-[#7A7365] border-transparent hover:text-[#22303F]'\n                    }`}\n                  >\n                    <MessageSquare className=\"w-4 h-4 sm:w-3.5 sm:h-3.5\" />\n                  </button>\n                </div>\n\n                {/* Inline Note Input */}\n                {activeNoteInputId === teacher.id && (\n                  <div className=\"w-full mt-2 flex items-center gap-2 bg-[#FBF0DD] p-2 rounded-lg border border-[#E1DACB]\">\n                    <input\n                      type=\"text\"\n                      placeholder=\"Masukkan alasan / keterangan tugas luar/dinas...\"\n                      value={noteText}\n                      onChange={(e) => setNoteText(e.target.value)}\n                      onKeyDown={(e) => {\n                        if (e.key === 'Enter') handleNoteSave(teacher.id);\n                      }}\n                      className=\"flex-1 text-xs bg-white px-2 py-1.5 rounded border border-[#E1DACB] text-[#22303F] focus:outline-none\"\n                    />\n                    <button\n                      onClick={() => handleNoteSave(teacher.id)}\n                      className=\"text-xs bg-[#1F3D2E] text-white px-2.5 py-1.5 rounded font-bold hover:bg-[#193326]\"\n                    >\n                      Simpan\n                    </button>\n                  </div>\n                )}\n              </div>\n            );\n          })\n        )}\n      </div>\n\n      {/* MODAL JADWAL GURU PIKET */}\n      {showPiketModal && (\n        <div className=\"fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-2 sm:p-4\">\n          <div className=\"bg-white border-2 border-[#EDE8DC] rounded-2xl max-w-3xl w-full p-4 sm:p-5 shadow-2xl max-h-[90vh] flex flex-col\">\n            <div className=\"flex items-center justify-between border-b border-[#EDE8DC] pb-3 shrink-0\">\n              <h3 className=\"font-kalam font-bold text-lg text-[#22303F] flex items-center gap-2\">\n                <ShieldCheck className=\"w-5 h-5 text-[#2B6CB0]\" />\n                <span>Jadwal Tugas Guru Piket (Mingguan)</span>\n              </h3>\n              <button\n                onClick={() => setShowPiketModal(false)}\n                className=\"w-8 h-8 rounded-full bg-[#F4F1E9] text-[#5B6B7A] hover:text-[#22303F] hover:bg-[#E1DACB] flex items-center justify-center transition cursor-pointer\"\n              >\n                <X className=\"w-4 h-4\" />\n              </button>\n            </div>\n\n            <div className=\"space-y-3 overflow-y-auto py-4 pr-1 flex-1\">\n              <p className=\"text-xs text-[#5B6B7A]\">\n                Berikut adalah daftar Dewan Guru yang bertugas sebagai <b>Guru Piket</b> setiap hari di sekolah.\n              </p>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3\">\n                {HARI_DALAM_SEMINGGU.map(hari => {\n                  const teachersOnPiket = roster.teachers.filter(g => g.jadwalPiket && g.jadwalPiket.includes(hari));\n                  const isToday = hari === currentDayName;\n\n                  return (\n                    <div\n                      key={hari}\n                      className={`p-3 rounded-xl border transition ${\n                        isToday\n                          ? 'bg-[#F0F7FF] border-[#2B6CB0] ring-2 ring-[#2B6CB0]/20'\n                          : 'bg-[#FAF8F5] border-[#EDE8DC]'\n                      }`}\n                    >\n                      <div className=\"flex items-center justify-between border-b border-[#E1DACB] pb-1.5 mb-2\">\n                        <span className=\"font-bold text-xs text-[#22303F] flex items-center gap-1\">\n                          📅 {hari}\n                        </span>\n                        {isToday && (\n                          <span className=\"bg-[#2B6CB0] text-white text-[9px] font-extrabold px-1.5 py-0.2 rounded\">\n                            HARI INI\n                          </span>\n                        )}\n                      </div>\n\n                      {teachersOnPiket.length === 0 ? (\n                        <p className=\"text-[11px] text-[#8C9BA5] italic\">Tidak ada guru piket</p>\n                      ) : (\n                        <ul className=\"space-y-1.5\">\n                          {teachersOnPiket.map(t => {\n                            const att = attendanceMap[t.id];\n                            return (\n                              <li key={t.id} className=\"text-xs bg-white p-2 rounded-lg border border-[#EDE8DC]\">\n                                <div className=\"font-bold text-[#22303F]\">{t.nama}</div>\n                                <div className=\"text-[10px] text-[#5B6B7A] flex items-center justify-between mt-0.5\">\n                                  <span>{t.mataPelajaran || 'Guru'}</span>\n                                  {isToday && att && (\n                                    <span className={`px-1.5 py-0.2 rounded text-[9px] font-bold ${\n                                      att.status === 'hadir' ? 'bg-[#E4F3EA] text-[#1F7A4C]' :\n                                      att.status === 'izin' ? 'bg-[#FBF0DD] text-[#B5730E]' :\n                                      att.status === 'sakit' ? 'bg-[#F0E8F9] text-[#8B5FBF]' :\n                                      'bg-[#FBE6E6] text-[#C23B3B]'\n                                    }`}>\n                                      {att.status.toUpperCase()}\n                                    </span>\n                                  )}\n                                </div>\n                              </li>\n                            );\n                          })}\n                        </ul>\n                      )}\n                    </div>\n                  );\n                })}\n              </div>\n            </div>\n\n            <div className=\"flex justify-end pt-3 border-t border-[#EDE8DC] shrink-0\">\n              <button\n                type=\"button\"\n                onClick={() => setShowPiketModal(false)}\n                className=\"bg-[#1F3D2E] text-white font-semibold text-xs px-5 py-2 rounded-lg hover:bg-[#193326] cursor-pointer\"\n              >\n                Tutup\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n};\n\n\n// ===== src/components/ViewAbsenEskul.tsx =====\n\n\n\n\n\ninterface ViewAbsenEskulProps {\n  roster: Roster;\n  selectedEskulId: string;\n  onSelectEskulId: (id: string) => void;\n  selectedDate: string;\n  onSelectDate: (dateStr: string) => void;\n  attendanceMap: DailyAttendanceMap;\n  onStampStatus: (personId: string, status: AttendanceStatus | null, note?: string) => void;\n  onBulkStamp: (personIds: string[], status: AttendanceStatus) => void;\n  onResetAttendance: (personIds: string[]) => void;\n  onShowToast: (msg: string) => void;\n  onOpenScanner?: () => void;\n  onOpenBarcodeCard?: (person?: Person) => void;\n}\n\nconst ViewAbsenEskul: React.FC<ViewAbsenEskulProps> = ({\n  roster,\n  selectedEskulId,\n  onSelectEskulId,\n  selectedDate,\n  onSelectDate,\n  attendanceMap,\n  onStampStatus,\n  onBulkStamp,\n  onResetAttendance,\n  onShowToast,\n  onOpenScanner,\n  onOpenBarcodeCard\n}) => {\n  const [activeCategoryTab, setActiveCategoryTab] = useState<'siswa' | 'guru'>('siswa');\n  const [selectedKelasFilter, setSelectedKelasFilter] = useState<string>('all');\n  const [teacherFilter, setTeacherFilter] = useState<'assigned' | 'all'>('assigned');\n  const [searchQuery, setSearchQuery] = useState<string>('');\n  const [isFilterOpen, setIsFilterOpen] = useState<boolean>(false);\n  const [activeNoteModal, setActiveNoteModal] = useState<{ id: string; nama: string; note: string } | null>(null);\n\n  const eskulList: EskulItem[] = (roster.eskuls && roster.eskuls.length > 0) ? roster.eskuls : DEFAULT_ESKULS;\n  const currentEskul = eskulList.find(e => e.id === selectedEskulId) || eskulList[0];\n\n  // Assigned teachers for the currently selected Eskul\n  const assignedTeachers = roster.teachers.filter(t => {\n    if (t.eskulIds && currentEskul && t.eskulIds.includes(currentEskul.id)) return true;\n    if (currentEskul?.pembina && currentEskul.pembina.toLowerCase().includes(t.nama.toLowerCase().split(',')[0])) return true;\n    return false;\n  });\n\n  // Filter students by class and search query\n  const filteredStudents = roster.students.filter(s => {\n    const matchKelas = selectedKelasFilter === 'all' || s.kelas === selectedKelasFilter;\n    const q = searchQuery.toLowerCase().trim();\n    const matchSearch = !q || s.nama.toLowerCase().includes(q) || (s.nisNip && s.nisNip.toLowerCase().includes(q)) || (s.kelas && s.kelas.toLowerCase().includes(q));\n    return matchKelas && matchSearch;\n  });\n\n  // Filter teachers by subtab and search query\n  const teacherSource = (teacherFilter === 'assigned' && assignedTeachers.length > 0) ? assignedTeachers : roster.teachers;\n  const filteredTeachers = teacherSource.filter(t => {\n    const q = searchQuery.toLowerCase().trim();\n    return !q || t.nama.toLowerCase().includes(q) || (t.nisNip && t.nisNip.toLowerCase().includes(q)) || (t.mataPelajaran && t.mataPelajaran.toLowerCase().includes(q));\n  });\n\n  // Calculate statistics for active tab list\n  const currentList = activeCategoryTab === 'siswa' ? filteredStudents : filteredTeachers;\n  const totalCount = currentList.length;\n  let countHadir = 0;\n  let countIzin = 0;\n  let countSakit = 0;\n  let countAlpa = 0;\n  let totalHonorEskulHariIni = 0;\n\n  currentList.forEach(person => {\n    const entry = attendanceMap[person.id];\n    if (entry) {\n      if (entry.status === 'hadir') {\n        countHadir++;\n        if (activeCategoryTab === 'guru') {\n          const tarif = person.tarifHarian !== undefined ? person.tarifHarian : 150000;\n          totalHonorEskulHariIni += tarif;\n        }\n      }\n      else if (entry.status === 'izin') countIzin++;\n      else if (entry.status === 'sakit') countSakit++;\n      else if (entry.status === 'alpa') countAlpa++;\n    }\n  });\n\n  const countBelum = Math.max(0, totalCount - (countHadir + countIzin + countSakit + countAlpa));\n\n  const hasActiveFilter = (activeCategoryTab === 'siswa' && selectedKelasFilter !== 'all') ||\n                          (activeCategoryTab === 'guru' && teacherFilter === 'all') ||\n                          searchQuery.trim().length > 0;\n\n  const handleResetFilters = () => {\n    setSelectedKelasFilter('all');\n    setTeacherFilter('assigned');\n    setSearchQuery('');\n  };\n\n  const handleSaveNote = () => {\n    if (!activeNoteModal) return;\n    const currentStatus = attendanceMap[activeNoteModal.id]?.status || 'izin';\n    onStampStatus(activeNoteModal.id, currentStatus, activeNoteModal.note);\n    setActiveNoteModal(null);\n    onShowToast(`Catatan untuk ${activeNoteModal.nama} berhasil disimpan`);\n  };\n\n  return (\n    <div className=\"space-y-3.5\">\n      {/* Top Header & Actions */}\n      <div className=\"bg-white border border-[#EDE8DC] rounded-2xl p-3.5 shadow-2xs space-y-3\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2.5\">\n          <div>\n            <h2 className=\"font-kalam text-xl sm:text-2xl font-bold text-[#22303F] flex items-center gap-2 leading-tight\">\n              <Trophy className=\"w-5 h-5 text-[#B5730E]\" />\n              <span>Absensi Ekstrakurikuler</span>\n            </h2>\n            <p className=\"text-[11px] sm:text-xs text-[#5B6B7A]\">\n              Pilih kegiatan eskul dan kelola absensi anggota/pembina secara presisi.\n            </p>\n          </div>\n\n          <div className=\"flex items-center gap-2\">\n            {onOpenScanner && (\n              <button\n                onClick={onOpenScanner}\n                className=\"bg-[#1F3D2E] hover:bg-[#163022] text-white text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 shadow-2xs cursor-pointer active:scale-95 touch-manipulation\"\n                title=\"Scan Barcode / QR Kartu Anggota Eskul\"\n              >\n                <QrCode className=\"w-4 h-4 text-amber-300\" />\n                <span>Scan Barcode</span>\n              </button>\n            )}\n\n            <div className=\"flex items-center gap-1.5 bg-[#FAF8F5] border border-[#E1DACB] px-2.5 py-1 rounded-xl shadow-2xs\">\n              <Calendar className=\"w-3.5 h-3.5 text-[#1F3D2E] shrink-0\" />\n              <input\n                type=\"date\"\n                value={selectedDate}\n                onChange={(e) => onSelectDate(e.target.value)}\n                className=\"bg-transparent text-xs font-jetbrains text-[#22303F] font-bold focus:outline-none cursor-pointer\"\n              />\n            </div>\n          </div>\n        </div>\n\n        {/* Eskul Selection Pills (Horizontal scrollable) */}\n        <div className=\"flex items-center gap-1.5 overflow-x-auto pb-1 pt-1 no-scrollbar\">\n          {eskulList.map((eskul) => {\n            const isSelected = eskul.id === (currentEskul?.id);\n            return (\n              <button\n                key={eskul.id}\n                onClick={() => onSelectEskulId(eskul.id)}\n                className={`text-xs px-3 py-1.5 rounded-xl font-bold border transition-all cursor-pointer flex items-center gap-1.5 shrink-0 touch-manipulation ${\n                  isSelected\n                    ? 'bg-[#1F3D2E] text-white border-[#1F3D2E] shadow-2xs scale-102'\n                    : 'bg-[#FAF8F5] text-[#5B6B7A] border-[#E1DACB] hover:bg-white hover:text-[#22303F]'\n                }`}\n              >\n                <Award className={`w-3.5 h-3.5 ${isSelected ? 'text-[#A3D9B1]' : 'text-[#8C9AA8]'}`} />\n                <span>{eskul.nama}</span>\n              </button>\n            );\n          })}\n        </div>\n\n        {/* Category Switcher: Siswa vs Guru */}\n        <div className=\"grid grid-cols-2 gap-2 pt-1\">\n          <button\n            onClick={() => setActiveCategoryTab('siswa')}\n            className={`py-2 px-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 cursor-pointer touch-manipulation whitespace-nowrap overflow-hidden ${\n              activeCategoryTab === 'siswa'\n                ? 'bg-[#1F3D2E] text-white border-[#1F3D2E] shadow-xs'\n                : 'bg-[#FAF8F5] text-[#5B6B7A] border-[#E1DACB] hover:bg-white'\n            }`}\n          >\n            <span className=\"truncate\">🎓 Absensi Siswa ({roster.students.length})</span>\n          </button>\n\n          <button\n            onClick={() => setActiveCategoryTab('guru')}\n            className={`py-2 px-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 cursor-pointer touch-manipulation whitespace-nowrap overflow-hidden ${\n              activeCategoryTab === 'guru'\n                ? 'bg-[#1F3D2E] text-white border-[#1F3D2E] shadow-xs'\n                : 'bg-[#FAF8F5] text-[#5B6B7A] border-[#E1DACB] hover:bg-white'\n            }`}\n          >\n            <UserCheck className=\"w-3.5 h-3.5 text-[#F6AD55] shrink-0\" />\n            <span className=\"truncate\">👨‍🏫 Pembina & Guru ({roster.teachers.length})</span>\n          </button>\n        </div>\n      </div>\n\n      {/* Current Eskul Info & Compact Details */}\n      {currentEskul && (\n        <div className=\"bg-[#FAF8F5] border border-[#EDE8DC] rounded-2xl p-2.5 sm:p-3 flex flex-row items-center justify-between gap-2 text-xs shadow-2xs overflow-hidden\">\n          <div className=\"flex items-center gap-2 min-w-0 truncate\">\n            <span className=\"font-bold text-[#22303F] text-xs sm:text-sm flex items-center gap-1.5 shrink-0\">\n              <Trophy className=\"w-4 h-4 text-[#B5730E] shrink-0\" />\n              <span className=\"truncate\">{currentEskul.nama}</span>\n            </span>\n\n            {currentEskul.hari && (\n              <span className=\"bg-[#E4F3EA] text-[#1F7A4C] border border-[#1F7A4C]/20 px-2 py-0.5 rounded-full text-[11px] font-bold shrink-0 whitespace-nowrap hidden sm:inline-block\">\n                📅 {currentEskul.hari} {currentEskul.jam ? `• ${currentEskul.jam}` : ''}\n              </span>\n            )}\n          </div>\n\n          <div className=\"text-[11px] text-[#5B6B7A] flex items-center gap-1 shrink-0 whitespace-nowrap\">\n            <span className=\"font-semibold text-[#22303F] hidden sm:inline\">👨‍🏫 Pembina:</span>\n            {assignedTeachers.length > 0 ? (\n              <span className=\"font-bold text-[#B5730E] bg-[#FFF4E5] border border-[#F6AD55]/40 px-2 py-0.5 rounded text-[10px] sm:text-[11px] truncate max-w-[160px] sm:max-w-xs\">\n                {assignedTeachers.map(t => t.nama).join(', ')} ({assignedTeachers.length})\n              </span>\n            ) : currentEskul.pembina ? (\n              <span className=\"font-semibold text-[#22303F] truncate max-w-[120px] sm:max-w-xs\">{currentEskul.pembina}</span>\n            ) : (\n              <span className=\"italic text-[#8C9AA8] text-[10px]\">Belum ditentukan</span>\n            )}\n          </div>\n        </div>\n      )}\n\n      {/* Summary Stats Cards */}\n      <div className={`grid gap-2 text-center text-xs ${activeCategoryTab === 'guru' ? 'grid-cols-2 sm:grid-cols-6' : 'grid-cols-2 sm:grid-cols-5'}`}>\n        <div className=\"bg-white border border-[#EDE8DC] rounded-xl p-2 shadow-2xs\">\n          <span className=\"text-[#1F7A4C] font-jetbrains text-lg font-bold block\">{countHadir}</span>\n          <span className=\"text-[10px] text-[#5B6B7A] font-semibold uppercase\">Hadir</span>\n        </div>\n        <div className=\"bg-white border border-[#EDE8DC] rounded-xl p-2 shadow-2xs\">\n          <span className=\"text-[#B5730E] font-jetbrains text-lg font-bold block\">{countIzin}</span>\n          <span className=\"text-[10px] text-[#5B6B7A] font-semibold uppercase\">Izin</span>\n        </div>\n        <div className=\"bg-white border border-[#EDE8DC] rounded-xl p-2 shadow-2xs\">\n          <span className=\"text-[#2B6CB0] font-jetbrains text-lg font-bold block\">{countSakit}</span>\n          <span className=\"text-[10px] text-[#5B6B7A] font-semibold uppercase\">Sakit</span>\n        </div>\n        <div className=\"bg-white border border-[#EDE8DC] rounded-xl p-2 shadow-2xs\">\n          <span className=\"text-[#C23B3B] font-jetbrains text-lg font-bold block\">{countAlpa}</span>\n          <span className=\"text-[10px] text-[#5B6B7A] font-semibold uppercase\">Alpa</span>\n        </div>\n        <div className=\"bg-[#FAF8F5] border border-[#EDE8DC] rounded-xl p-2 shadow-2xs col-span-2 sm:col-span-1\">\n          <span className=\"text-[#5B6B7A] font-jetbrains text-lg font-bold block\">{countBelum}</span>\n          <span className=\"text-[10px] text-[#5B6B7A] font-semibold uppercase\">Belum Absen</span>\n        </div>\n        {activeCategoryTab === 'guru' && (\n          <div className=\"bg-[#1F3D2E] text-white border border-[#193326] rounded-xl p-2 shadow-2xs col-span-2 sm:col-span-1\">\n            <span className=\"font-jetbrains text-xs sm:text-sm font-bold text-white block truncate\">\n              Rp {totalHonorEskulHariIni.toLocaleString('id-ID')}\n            </span>\n            <span className=\"text-[10px] text-[#A3D9B1] font-semibold uppercase block truncate\">Honor Sesi</span>\n          </div>\n        )}\n      </div>\n\n      {/* Control Bar: Filter Toggle & Quick Actions */}\n      <div className=\"space-y-2\">\n        <div className=\"flex items-center justify-between gap-2\">\n          {/* Toggle Collapsible Filter Button */}\n          <button\n            onClick={() => setIsFilterOpen(!isFilterOpen)}\n            className={`text-xs font-bold px-3 py-1.5 rounded-xl border transition flex items-center gap-1.5 cursor-pointer touch-manipulation ${\n              isFilterOpen || hasActiveFilter\n                ? 'bg-[#1F3D2E] text-white border-[#1F3D2E] shadow-2xs'\n                : 'bg-white text-[#5B6B7A] border-[#E1DACB] hover:bg-[#FAF8F5] hover:text-[#22303F]'\n            }`}\n          >\n            <Filter className=\"w-3.5 h-3.5 text-amber-300\" />\n            <span>{isFilterOpen ? 'Sembunyikan Filter' : 'Pencarian & Filter'}</span>\n            {hasActiveFilter && (\n              <span className=\"w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse\"></span>\n            )}\n            {isFilterOpen ? <ChevronUp className=\"w-3.5 h-3.5\" /> : <ChevronDown className=\"w-3.5 h-3.5\" />}\n          </button>\n\n          {/* Quick Bulk Actions */}\n          <div className=\"flex items-center gap-1.5\">\n            <button\n              onClick={() => {\n                const ids = currentList.map(item => item.id);\n                onBulkStamp(ids, 'hadir');\n                onShowToast(`Semua (${ids.length}) ${activeCategoryTab === 'siswa' ? 'siswa' : 'guru/pembina'} ditandai Hadir`);\n              }}\n              className=\"text-xs font-bold text-[#1F7A4C] bg-[#E4F3EA] border border-[#1F7A4C]/30 px-3 py-1.5 rounded-xl hover:bg-[#d6eedf] active:scale-95 transition flex items-center gap-1 shadow-2xs cursor-pointer touch-manipulation\"\n            >\n              <CheckCircle className=\"w-3.5 h-3.5\" />\n              <span>Semua Hadir</span>\n            </button>\n\n            <button\n              onClick={() => {\n                const ids = currentList.map(item => item.id);\n                onResetAttendance(ids);\n                onShowToast(`Absensi ${ids.length} ${activeCategoryTab === 'siswa' ? 'siswa' : 'guru'} di-reset`);\n              }}\n              className=\"text-xs font-semibold text-[#5B6B7A] bg-white border border-[#E1DACB] px-2.5 py-1.5 rounded-xl hover:text-[#22303F] hover:bg-[#FAF8F5] active:scale-95 transition flex items-center gap-1 cursor-pointer touch-manipulation\"\n              title=\"Reset status absensi di daftar ini\"\n            >\n              <RotateCcw className=\"w-3.5 h-3.5\" />\n              <span>Reset</span>\n            </button>\n          </div>\n        </div>\n\n        {/* Hidden Collapsible Filter Drawer */}\n        {isFilterOpen && (\n          <div className=\"bg-white border border-[#EDE8DC] rounded-2xl p-3.5 shadow-2xs space-y-3 animate-in fade-in slide-in-from-top-2 duration-200\">\n            <div className=\"flex items-center justify-between border-b border-[#EDE8DC] pb-2\">\n              <span className=\"text-xs font-bold text-[#22303F] flex items-center gap-1.5\">\n                <Search className=\"w-3.5 h-3.5 text-[#1F3D2E]\" />\n                <span>Filterisasi & Pencarian Presisi</span>\n              </span>\n              {hasActiveFilter && (\n                <button\n                  onClick={handleResetFilters}\n                  className=\"text-[11px] font-bold text-[#C23B3B] hover:underline flex items-center gap-1 cursor-pointer\"\n                >\n                  <X className=\"w-3 h-3\" />\n                  <span>Reset Filter</span>\n                </button>\n              )}\n            </div>\n\n            <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-2.5\">\n              {/* Search Box */}\n              <div className=\"relative\">\n                <Search className=\"w-3.5 h-3.5 absolute left-2.5 top-2.5 text-[#5B6B7A]\" />\n                <input\n                  type=\"text\"\n                  placeholder={activeCategoryTab === 'siswa' ? \"Cari nama siswa / NISN...\" : \"Cari nama guru / NIP / Mapel...\"}\n                  value={searchQuery}\n                  onChange={(e) => setSearchQuery(e.target.value)}\n                  className=\"w-full bg-[#FAF8F5] border border-[#E1DACB] rounded-xl pl-8 pr-3 py-1.5 text-xs text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                />\n              </div>\n\n              {/* Specific Category Filters */}\n              {activeCategoryTab === 'siswa' ? (\n                <div className=\"flex items-center gap-2\">\n                  <span className=\"text-xs font-bold text-[#5B6B7A] shrink-0\">Kelas:</span>\n                  <select\n                    value={selectedKelasFilter}\n                    onChange={(e) => setSelectedKelasFilter(e.target.value)}\n                    className=\"w-full bg-[#FAF8F5] border border-[#E1DACB] rounded-xl px-2.5 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    <option value=\"all\">Semua Kelas ({roster.students.length} Siswa)</option>\n                    {roster.classes.map(k => (\n                      <option key={k} value={k}>Kelas {k}</option>\n                    ))}\n                  </select>\n                </div>\n              ) : (\n                <div className=\"flex items-center gap-1 bg-[#FAF8F5] border border-[#E1DACB] p-1 rounded-xl\">\n                  <button\n                    onClick={() => setTeacherFilter('assigned')}\n                    className={`flex-1 text-[11px] font-bold px-2.5 py-1 rounded-lg transition ${\n                      teacherFilter === 'assigned'\n                        ? 'bg-[#B5730E] text-white shadow-2xs'\n                        : 'text-[#5B6B7A] hover:text-[#22303F]'\n                    }`}\n                  >\n                    ⭐ Pembina {currentEskul?.nama} ({assignedTeachers.length})\n                  </button>\n                  <button\n                    onClick={() => setTeacherFilter('all')}\n                    className={`flex-1 text-[11px] font-bold px-2.5 py-1 rounded-lg transition ${\n                      teacherFilter === 'all'\n                        ? 'bg-[#1F3D2E] text-white shadow-2xs'\n                        : 'text-[#5B6B7A] hover:text-[#22303F]'\n                    }`}\n                  >\n                    👥 Semua Guru ({roster.teachers.length})\n                  </button>\n                </div>\n              )}\n            </div>\n          </div>\n        )}\n      </div>\n\n      {/* Student / Teacher List */}\n      <div className=\"bg-white border border-[#EDE8DC] rounded-2xl overflow-hidden shadow-2xs divide-y divide-[#EDE8DC]\">\n        {currentList.length === 0 ? (\n          <div className=\"py-8 text-center text-xs text-[#5B6B7A] space-y-1\">\n            <p className=\"font-bold\">Tidak ada {activeCategoryTab === 'siswa' ? 'siswa' : 'guru / pembina'} ditemukan.</p>\n            <p>Cobalah untuk menyesuaikan pencarian atau filter kelas/pembina.</p>\n          </div>\n        ) : (\n          currentList.map((person, idx) => {\n            const entry = attendanceMap[person.id];\n            const currentStatus = entry?.status;\n            const isTeacher = activeCategoryTab === 'guru';\n            const isAssignedPembina = isTeacher && currentEskul && (\n              (person.eskulIds && person.eskulIds.includes(currentEskul.id)) ||\n              (currentEskul.pembina && currentEskul.pembina.toLowerCase().includes(person.nama.toLowerCase().split(',')[0]))\n            );\n\n            return (\n              <div\n                key={person.id}\n                className={`p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 transition ${\n                  currentStatus ? 'bg-[#FEFDFB]' : 'hover:bg-[#FAF8F5]'\n                }`}\n              >\n                {/* Info Siswa / Guru */}\n                <div className=\"flex items-start gap-2.5\">\n                  <span className=\"w-6 h-6 rounded-full bg-[#F4F1E9] text-[#5B6B7A] font-jetbrains text-xs font-bold flex items-center justify-center shrink-0 mt-0.5\">\n                    {idx + 1}\n                  </span>\n                  <div>\n                    <div className=\"flex flex-wrap items-center gap-2\">\n                      <h4 className=\"font-bold text-xs sm:text-sm text-[#22303F]\">{person.nama}</h4>\n                      {isTeacher ? (\n                        <span className=\"bg-[#E4F3EA] text-[#1F7A4C] border border-[#1F7A4C]/20 text-[10px] font-bold px-1.5 py-0.2 rounded\">\n                          {person.mataPelajaran || 'Pembina / Pelatih'}\n                        </span>\n                      ) : (\n                        <span className=\"bg-[#F4F1E9] text-[#5B6B7A] border border-[#E1DACB] text-[10px] font-bold px-1.5 py-0.2 rounded\">\n                          Kelas {person.kelas}\n                        </span>\n                      )}\n\n                      {/* Highlight if assigned pembina */}\n                      {isTeacher && isAssignedPembina && (\n                        <span className=\"bg-[#FFF4E5] text-[#B5730E] border border-[#F6AD55]/40 text-[10px] font-bold px-1.5 py-0.2 rounded flex items-center gap-0.5\">\n                          ⭐ Pembina Eskul\n                        </span>\n                      )}\n\n                      {onOpenBarcodeCard && (\n                        <button\n                          onClick={() => onOpenBarcodeCard(person)}\n                          className=\"p-1 text-[#5B6B7A] hover:text-[#1F3D2E] hover:bg-[#E4F3EA] rounded transition cursor-pointer\"\n      </div>\n      </div>\n\n      {/* Quick Navigation / Module Access */}\n      <div className=\"space-y-3 pt-2\">\n        <div className=\"flex items-center justify-between\">\n          <h3 className=\"text-base sm:text-lg font-extrabold text-[#22303F] flex items-center gap-2\">\n            <span>Akses Fitur Utama</span>\n          </h3>\n          <span className=\"text-xs font-medium text-[#7A8A99]\">Pilih menu untuk melanjutkan</span>\n        </div>\n\n        <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-3.5\">\n          {/* Absen Eskul */}\n          <button\n            id=\"cta-absen-eskul\"\n            onClick={() => onNavigate('eskul')}\n            className=\"group bg-white hover:bg-[#FAF7F0] border border-amber-300/80 hover:border-amber-500/90 rounded-2xl p-4 text-left shadow-[inset_0_1.5px_1px_rgba(255,255,255,0.95),inset_0_-1.5px_2px_rgba(217,160,35,0.12),0_2px_8px_rgba(0,0,0,0.06)] hover:shadow-md transition duration-200 flex flex-col justify-between gap-4 cursor-pointer\"\n          >\n            <div className=\"flex items-center justify-between w-full\">\n              <div className=\"w-10 h-10 rounded-xl bg-amber-100/80 border border-amber-300/60 text-amber-800 flex items-center justify-center group-hover:scale-105 transition-transform\">\n                <Trophy className=\"w-5 h-5 text-amber-700\" />\n              </div>\n              <div className=\"w-7 h-7 rounded-full bg-[#F4F1E9] border border-amber-300/40 group-hover:bg-amber-400 group-hover:text-[#0F2317] flex items-center justify-center transition\">\n                <ArrowRight className=\"w-3.5 h-3.5 text-[#5B6B7A] group-hover:text-[#0F2317]\" />\n              </div>\n            </div>\n            <div>\n              <h4 className=\"font-extrabold text-base text-[#22303F] group-hover:text-amber-900 transition\">Absen Eskul</h4>\n              <p className=\"text-xs text-[#5B6B7A] mt-1 font-medium\">Kegiatan Pramuka, Olahraga, Seni & Ekstrakurikuler</p>\n er\"\n          >\n            <div className=\"flex items-center justify-between w-full\">\n              <div className=\"w-10 h-10 rounded-xl bg-emerald-100/80 border border-emerald-300/60 text-emerald-800 flex items-center justify-center group-hover:scale-105 transition-transform\">\n                <Settings className=\"w-5 h-5 text-emerald-800\" />\n              </div>\n              <div className=\"w-7 h-7 rounded-full bg-[#F4F1E9] border border-amber-300/40 group-hover:bg-[#1F3D2E] group-hover:text-white flex items-center justify-center transition\">\n                <ArrowRight className=\"w-3.5 h-3.5 text-[#5B6B7A] group-hover:text-white\" />\n              </div>\n            </div>\n            <div>\n              <h4 className=\"font-extrabold text-base text-[#22303F] group-hover:text-emerald-900 transition\">Kelola Data</h4>\n              <p className=\"text-xs text-[#5B6B7A] mt-1 font-medium\">Manajemen master data kelas, siswa & guru</p>\n            </div>\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n\n\n// ===== src/components/BarcodeScannerModal.tsx =====\n\n\n\n\n\n\ninterface BarcodeScannerModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  roster: Roster;\n  selectedDate: string;\n  onStampAttendance: (personId: string, role: PersonRole, status: AttendanceStatus) => void;\n  onShowToast: (msg: string) => void;\n}\n\nfunction playBeepSound() {\n  try {\n    const AudioCtx = window.AudioContext || (window as any).webkitAudioContext;\n    if (!AudioCtx) return;\n    const ctx = new AudioCtx();\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n    osc.type = 'sine';\n    osc.frequency.setValueAtTime(1046.5, ctx.currentTime);\n    gain.gain.setValueAtTime(0.25, ctx.currentTime);\n    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start();\n    osc.stop(ctx.currentTime + 0.18);\n  } catch {\n    // audio play ignored if blocked\n  }\n}\n\nfunction playErrorSound() {\n  try {\n    const AudioCtx = window.AudioContext || (window as any).webkitAudioContext;\n    if (!AudioCtx) return;\n    const ctx = new AudioCtx();\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n    osc.type = 'sawtooth';\n    osc.frequency.setValueAtTime(220, ctx.currentTime);\n    gain.gain.setValueAtTime(0.3, ctx.currentTime);\n    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start();\n    osc.stop(ctx.currentTime + 0.35);\n  } catch {\n    // audio play ignored\n  }\n}\n\nconst BarcodeScannerModal: React.FC<BarcodeScannerModalProps> = ({\n  isOpen,\n  onClose,\n  roster,\n  selectedDate,\n  onStampAttendance,\n  onShowToast\n}) => {\n  const [enforceScheduleSecurity, setEnforceScheduleSecurity] = useState<boolean>(true);\n  const [lastScannedPerson, setLastScannedPerson] = useState<{\n    person: Person;\n    time: string;\n  } | null>(null);\n  const [scanError, setScanError] = useState<string | null>(null);\n  const [cameraStatus, setCameraStatus] = useState<'starting' | 'active' | 'error'>('starting');\n  const [facingMode, setFacingMode] = useState<'environment' | 'user'>('environment');\n\n  const html5QrCodeRef = useRef<Html5Qrcode | null>(null);\n\n  // Handle scanned string logic\n  const processScannedCode = (decodedText: string) => {\n    setScanError(null);\n    const cleanText = decodedText.trim();\n    if (!cleanText) return;\n\n    // Remove prefixes like \"SISWA:\", \"GURU:\", \"ID:\" if present\n    const codeMatch = cleanText.replace(/^(SISWA:|GURU:|ID:)/i, '').trim();\n\n    const allPeople: Person[] = [...roster.students, ...roster.teachers];\n    \n    // Find matching person by nisNip, id, or exact name\n    const foundPerson = allPeople.find(p =>\n      (p.nisNip && p.nisNip.toLowerCase() === codeMatch.toLowerCase()) ||\n      p.id === codeMatch ||\n      (p.nisNip && p.nisNip.toLowerCase() === cleanText.toLowerCase()) ||\n      p.id === cleanText ||\n      p.nama.toLowerCase() === cleanText.toLowerCase()\n    );\n\n    if (foundPerson) {\n      // SECURITY CHECK: If person is a Teacher & Security Enforcement is Active\n      if (foundPerson.role === 'guru' && enforceScheduleSecurity) {\n        const currentDayName = getDayNameFromDateString(selectedDate);\n        const hasJadwalHari = Array.isArray(foundPerson.jadwalHari) && foundPerson.jadwalHari.length > 0;\n        const hasJadwalPiket = Array.isArray(foundPerson.jadwalPiket) && foundPerson.jadwalPiket.length > 0;\n\n        const isScheduledToday =\n          (hasJadwalHari && foundPerson.jadwalHari!.includes(currentDayName)) ||\n          (hasJadwalPiket && foundPerson.jadwalPiket!.includes(currentDayName));\n\n        if (!isScheduledToday) {\n          playErrorSound();\n          const errorMsg = `⛔ DITOLAK (KEAMANAN): Guru / Operator / Staf ${foundPerson.nama} TIDAK MASUK pada jadwal hari ${currentDayName}! Presensi diblokir.`;\n          setScanError(errorMsg);\n          onShowToast(`⛔ Scan Ditolak! ${foundPerson.nama} tidak ada jadwal hari ${currentDayName}`);\n          return;\n        }\n      }\n\n      playBeepSound();\n      onStampAttendance(foundPerson.id, foundPerson.role, 'hadir');\n      \n      const nowStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });\n      setLastScannedPerson({\n        person: foundPerson,\n        time: nowStr\n      });\n\n      onShowToast(`✅ ${foundPerson.role === 'siswa' ? 'Siswa' : 'Guru'} ${foundPerson.nama} dicatat HADIR (${nowStr})`);\n    } else {\n      playErrorSound();\n      setScanError(`Kode \"${cleanText}\" tidak ditemukan di data Siswa/Guru.`);\n    }\n  };\n\n  // Direct camera stream initialization via Html5Qrcode\n  useEffect(() => {\n    if (!isOpen) {\n      stopCamera();\n      return;\n    }\n\n    let isMounted = true;\n    let startPromise: Promise<void> | null = null;\n    setCameraStatus('starting');\n\n    const timer = setTimeout(async () => {\n      const element = document.getElementById(\"qr-reader-container\");\n      if (!element || !isMounted) return;\n\n      try {\n        const qrCode = new Html5Qrcode(\"qr-reader-container\", {\n          formatsToSupport: [\n            Html5QrcodeSupportedFormats.QR_CODE,\n            Html5QrcodeSupportedFormats.CODE_128,\n            Html5QrcodeSupportedFormats.CODE_39,\n            Html5QrcodeSupportedFormats.EAN_13,\n            Html5QrcodeSupportedFormats.EAN_8\n          ],\n          verbose: false\n        });\n        html5QrCodeRef.current = qrCode;\n\n        startPromise = qrCode.start(\n          { facingMode: facingMode },\n          {\n            fps: 15,\n            qrbox: { width: 240, height: 240 }\n          },\n          (decodedText) => {\n            if (isMounted) processScannedCode(decodedText);\n          },\n          () => {}\n        );\n\n        try {\n          await startPromise;\n          if (isMounted) {\n            setCameraStatus('active');\n          } else {\n            if (qrCode.isScanning) {\n              await qrCode.stop().catch(() => {});\n            }\n            qrCode.clear();\n          }\n        } catch (err) {\n          if (!isMounted) return;\n          console.warn('Primary camera mode failed, trying fallback:', err);\n          // Fallback to any camera user/webcam\n          startPromise = qrCode.start(\n            { facingMode: facingMode === 'environment' ? 'user' : 'environment' },\n            { fps: 15, qrbox: { width: 240, height: 240 } },\n            (decodedText) => {\n              if (isMounted) processScannedCode(decodedText);\n            },\n            () => {}\n          );\n\n          try {\n            await startPromise;\n            if (isMounted) {\n              setCameraStatus('active');\n            } else {\n              if (qrCode.isScanning) {\n                await qrCode.stop().catch(() => {});\n              }\n              qrCode.clear();\n            }\n          } catch (fallbackErr) {\n            console.error('All camera attempts failed:', fallbackErr);\n            if (isMounted) setCameraStatus('error');\n          }\n        }\n      } catch (err) {\n        console.error('Html5Qrcode init error:', err);\n        if (isMounted) setCameraStatus('error');\n      }\n    }, 150);\n\n    return () => {\n      isMounted = false;\n      clearTimeout(timer);\n\n      const instance = html5QrCodeRef.current;\n      html5QrCodeRef.current = null;\n\n      if (instance) {\n        (async () => {\n          try {\n            if (startPromise) {\n              await startPromise.catch(() => {});\n            }\n            if (instance.isScanning) {\n              await instance.stop().catch(() => {});\n            }\n            instance.clear();\n          } catch (err) {\n            console.warn('Error in camera cleanup:', err);\n          }\n        })();\n      }\n    };\n  }, [isOpen, facingMode]);\n\n  const stopCamera = async () => {\n    const instance = html5QrCodeRef.current;\n    if (instance) {\n      html5QrCodeRef.current = null;\n      try {\n        if (instance.isScanning) {\n          await instance.stop().catch(() => {});\n        }\n        instance.clear();\n      } catch (err) {\n        console.warn('Error stopping camera:', err);\n      }\n    }\n  };\n\n  const toggleCameraFacing = () => {\n    setFacingMode(prev => prev === 'environment' ? 'user' : 'environment');\n  };\n\n  if (!isOpen) return null;\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs animate-in fade-in duration-200\">\n      <div className=\"bg-[#FEFDFB] border border-[#E1DACB] w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]\">\n        {/* Modal Header */}\n        <div className=\"bg-[#1F3D2E] text- '}\n                </span>\n              </div>\n            </div>\n\n            <label className=\"relative inline-flex items-center cursor-pointer shrink-0\">\n              <input\n                type=\"checkbox\"\n                checked={enforceScheduleSecurity}\n                onChange={(e) => setEnforceScheduleSecurity(e.target.checked)}\n                className=\"sr-only peer\"\n              />\n              <div className=\"w-8 h-4.5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:bg-[#1F7A4C]\"></div>\n            </label>\n          </div>\n\n          {/* Last Scanned Confirmation Alert */}\n          {lastScannedPerson && (\n            <div className=\"bg-[#E4F3EA] border border-[#1F7A4C]/30 rounded-xl p-3 flex items-center gap-3 animate-in zoom-in-95 duration-200 shadow-2xs\">\n              <div className=\"w-10 h-10 rounded-full bg-[#1F7A4C] text-white flex items-center justify-center shrink-0 font-bold text-sm shadow-2xs\">\n                <CheckCircle2 className=\"w-6 h-6\" />\n              </div>\n              <div className=\"min-w-0 flex-1\">\n                <div className=\"flex items-center gap-2\">\n                  <span className=\"text-[10px] font-bold uppercase tracking-wider bg-[#1F7A4C] text-white px-1.5 py-0.2 rounded\">\n                    {lastScannedPerson.person.role === 'siswa' ? `Kelas ${lastScannedPerson.person.kelas}` : 'Guru'}\n                  </span>\n                  <span className=\"text-[10px] text-[#1F7A4C] font-semibold\">{lastScannedPerson.time} WIB</span>\n                </div>\n                <p className=\"font-bold text-sm text-[#1F3D2E] truncate\">{lastScannedPerson.person.nama}</p>\n                <p className=\"text-xs text-[#          onClick={onClose}\n            className=\"bg-[#E1DACB] text-[#5B6B7A] font-bold text-xs px-4 py-1.5 rounded-lg hover:bg-[#d5cebe] transition cursor-pointer\"\n          >\n            Tutup\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n\n\n// ===== src/components/HeaderBoard.tsx =====\n\n\n\n\ninterface HeaderBoardProps {\n  sekolahInfo: SekolahInfo;\n  todayDateStr: string;\n  formattedToday: string;\n  onOpenScanner?: () => void;\n  onOpenBarcodeCard?: () => void;\n}\n\nconst HeaderBoard: React.FC<HeaderBoardProps> = ({\n  sekolahInfo,\n  formattedToday,\n  onOpenScanner,\n  onOpenBarcodeCard\n}) => {\n  return (\n    <header className=\"chalkboard-bg text-white py-2 px-3 sm:px-4 border-b-2 sm:border-b-4 border-[#163022] shadow-sm sticky top-0 z-30\">\n      <div className=\"max-w-5xl mx-auto flex items-center justify-between gap-2\">\n        <div className=\"flex items-center gap-2\">\n          <BookOpen className=\"w-5 h-5 sm:w-6 sm:h-6 text-[#F5F0E6] opacity-90 shrink-0\" />\n          <div>\n            <h1 className=\"font-kalam text-lg sm:text-2xl font-bold tracking-wide text-[#F5F0E6] leading-tight\">\n              Buku Absen Online\n            </h1>\n            <p className=\"font-kalam text-xs sm:text-sm text-[#CFE3D6] font-medium leading-none\">\n              {sekolahInfo.nama || 'Sekolah Kita'}\n            </p>\n          </div>\n        </div>\n        <div className=\"flex items-center gap-1.5 shrink-0\">\n          {onOpenBarcodeCard && (\n            <button\n              onClick={onOpenBarcodeCard}\n              className=\"flex items-center gap-1.5 bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 text-[#0F2317] hover:from-amber-200 hover:to-amber-400 px-3 py-1.5 rounded-xl font-extrabold text-xs shadow-[inset_0_1.5px_1px_rgba(255,255,255,0.8),inset_0_-1.5px_2px_rgba(0,0,0,0.2),0_2px_0_#92400E,0_4px_8px_rgba(0,0,0,0.15)] active:translate-y-0.5 active:shadow-[inset_0_1px_2px_rgba(0,0,0,0.3), lative flex items-center justify-center\">\n            {/* Top Amber Highlight Bar */}\n            <div className=\"absolute top-1 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-amber-500 rounded-full shadow-[0_1px_2px_rgba(0,0,0,0.15)]\" />\n          </div>\n        </div>\n\n        {navItemsLeft.map(renderNavButton)}\n\n        {/* CENTER PROMINENT RAISED SCAN BUTTON */}\n        <div className=\"flex-1 flex flex-col items-center justify-center -mt-6 sm:-mt-7 z-50\">\n          <button\n            id=\"bottom-nav-scan\"\n            onClick={onOpenScanner}\n            className=\"group relative flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-b from-[#2A8B5B] via-[#1F7A4C] to-[#124B2E] text-white ring-4 ring-[#163022] shadow-[inset_0_2px_1.5px_rgba(255,255,255,0.7),inset_0_-2px_3px_rgba(0,0,0,0.3),0_3.5px_0_#0D281B,0_6px_14px_rgba(0,0,0,0.35)] active:translate-y-1 active:shadow-[inset_0_2px_4px_rgba(0,0,0,0.5),0_1px_0_#0D281B] transition-all duration-150 transform-gpu cursor-pointer touch-manipulation border border-emerald-300/40\"\n            title=\"Pindai / Scan Barcode Absensi (Kamera HP)\"\n          >\n            <QrCode className=\"w-6 h-6 sm:w-8 sm:h-8 text-amber-300 group-hover:scale-105 transition-transform duration-200\" />\n            <span className=\"text-[8px] sm:text-[10px] font-black tracking-widest uppercase text-white mt-0.5\">\n              SCAN\n            </span>\n          </button>\n        </div>\n\n        {navItemsRight.map(renderNavButton)}\n      </div>\n    </nav>\n  );\n};\n\n\n// ===== src/App.tsx =====\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction App() {\n  const todayStr = getTodayDateString();\n  const formattedToday = formatIndonesianDate(todayStr);\n\n  const [activeView, setActiveView] = useState<ViewMode>('home');\n  const [sekolahInfo, setSekolahInfo] = useState<SekolahInfo>(() => loadSekolahInfo());\n  const [roster, setRoster] = useState<Roster>(() => loadRoster());\n\n  const [selectedDateSiswa, setSelectedDateSiswa] = useState<string>(todayStr);\n  const [selectedDateGuru, setSelectedDateGuru] = useState<string>(todayStr);\n  const [selectedDateEskul, setSelectedDateEskul] = useState<string>(todayStr);\n  const [selectedEskulId, setSelectedEskulId] = useState<string>(() => {\n    const list = roster.eskuls || DEFAULT_ESKULS;\n    return list[0]?.id || 'esk_1';\n  });\n  const [selectedKelasSiswa, setSelectedKelasSiswa] = useState<string>(() => roster.classes[0] || '');\n\n  const [attSiswa, setAttSiswa] = useState<DailyAttendanceMap>(() =>\n    getAttendanceForDate('siswa', todayStr)\n  );\n  const [attGuru, setAttGuru] = useState<DailyAttendanceMap>(() =>\n    getAttendanceForDate('guru', todayStr)\n  );\n  const [attEskul, setAttEskul] = useState<DailyAttendanceMap>(() =>\n    getAttendanceForDate(`eskul_${selectedEskulId}`, todayStr)\n  );\n\n  const [toastMsg, setToastMsg] = useState<string | null>(null);\n  const [isScannerOpen, setIsScannerOpen] = useState<boolean>(false);\n  const [barcodeCardModal, setBarcodeCardModal] = useState<{ isOpen: boolean; person: Person | null }>({\n    isOpen: false,\n    person: null\n  });\n\n  const showToast = (msg: string) => {\n    setToastMsg(msg);\n    setTimeout(() => {\n      setToastMsg((current) => (current === msg ? null : current));\n    }, 2400);\n  };\n\n  const openBarcodeCard = (person?: Person | null) => {\n    setBarcodeCardModal({\n      isOpen: true,\n      person: person || null\n    });\n  };\n\n  // Initialize Firebase Cloud Data & Real-time Subscriptions\n  useEffect(() => {\n    const initialAtt = generateInitialAttendance(todayStr);\n    initCloudDataIfNeeded(DEFAULT_SEKOLAH_INFO, DEFAULT_ROSTER, todayStr, initialAtt);\n\n    const unsubInfo = subscribeSekolahInfo((info) => {\n      setSekolahInfo(info);\n      saveSekolahInfo(info);\n    });\n\n    const unsubRoster = subscribeRoster((newRoster) => {\n      let updatedRoster = newRoster;\n      if (!updatedRoster.teachers || updatedRoster.teachers.length === 0) {\n        updatedRoster = { ...updatedRoster, teachers: DEFAULT_ROSTER.teachers };\n        saveRosterCloud(updatedRoster);\n      }\n      setRoster(updatedRoster);\n      saveRoster(updatedRoster);\n    });\n\n    return () => {\n      unsubInfo();\n      unsubRoster();\n    };\n  }, [todayStr]);\n\n  // Real-time Attendance Listener for Siswa\n  useEffect(() => {\n    const unsub = subscribeAttendance('siswa', selectedDateSiswa, (dataMap) => {\n      setAttSiswa(dataMap);\n      saveAttendanceForDate('siswa', selectedDateSiswa, dataMap);\n    });\n    return () => unsub();\n  }, [selectedDateSiswa]);\n\n  // Real-time Attendance Listener for Guru\n  useEffect(() => {\n    const unsub = subscribeAttendance('guru', selectedDateGuru, (dataMap) => {\n      setAttGuru(dataMap);\n      saveAttendanceForDate('guru', selectedDateGuru, dataMap);\n    });\n    return () => unsub();\n  }, [selectedDateGuru]);\n\n  // Real-time Attendance Listener for Eskul\n  useEffect(() => {\n    const typeKey = `eskul_${selectedEskulId}`;\n    const unsub = subscribeAttendance(typeKey, selectedDateEskul, (dataMap) => {\n      setAttEskul(dataMap);\n      saveAttendanceForDate(typeKey, selectedDateEskul, dataMap);\n    });\n    return () => unsub();\n  }, [selectedEskulId, selectedDateEskul]);\n\n  // Keep selected kelas valid\n  useEffect(() => {\n    if (roster.classes.length > 0 && (!selectedKelasSiswa || !roster.classes.includes(selectedKelasSiswa))) {\n      setSelectedKelasSiswa(roster.classes[0]);\n    }\n  }, [roster.classes, selectedKelasSiswa]);\n\n  // Single stamp handler\n  const handleStampStatus = (\n    type: 'siswa' | 'guru',\n    personId: string,\n    status: AttendanceStatus | null,\n    note?: string\n  ) => {\n    const dateStr = type === 'siswa' ? selectedDateSiswa : selectedDateGuru;\n    const updated = updateAttendanceStatus(type, dateStr, personId, status, note);\n    if (type === 'siswa') setAttSiswa(updated);\n    else setAttGuru(updated);\n\n    // Save to Cloud Firebase\n    saveAttendanceCloud(type, dateStr, updated);\n  };\n\n  // Bulk stamp handler\n  const handleBulkStamp = (type: 'siswa' | 'guru', personIds: string[], status: AttendanceStatus) => {\n    const dateStr = type === 'siswa' ? selectedDateSiswa : selectedDateGuru;\n    const current = getAttendanceForDate(type, dateStr);\n    const now = new Date();\n    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;\n\n    personIds.forEach((id) => {\n      current[id] = {\n        status,\n        jam: current[id]?.jam || timeStr,\n        keterangan: current[id]?.keterangan || ''\n      };\n    });\n\n    saveAttendanceForDate(type, dateStr, current);\n    if (type === 'siswa') setAttSiswa({ ...current });\n    else setAttGuru({ ...current });\n\n    // Save to Cloud Firebase\n    saveAttendanceCloud(type, dateStr, current);\n  };\n\n  // Reset attendance handler\n  const handleResetAttendance = (type: 'siswa' | 'guru', personIds: string[]) => {\n    const dateStr = type === 'siswa' ? selectedDateSiswa : selectedDateGuru;\n    const current = getAttendanceForDate(type, dateStr);\n    personIds.forEach((id) => {\n      delete current[id];\n    });\n    saveAttendanceForDate(type, dateStr, current);\n    if (type === 'siswa') setAttSiswa({ ...current });\n    else setAttGuru({ ...current });\n\n    // Save to Cloud Firebase\n    saveAttendanceCloud(type, dateStr, current);\n  };\n\n  // Save updated roster\n  const handleSaveRoster = (newRoster: Roster) => {\n    setRoster(newRoster);\n    saveRoster(newRoster);\n    saveRosterCloud(newRoster);\n  };\n\n  // Save updated school info\n  const handleSaveSekolahInfo = (newInfo: SekolahInfo) => {\n    setSekolahInfo(newInfo);\n    saveSekolahInfo(newInfo);\n    saveSekolahInfoCloud(newInfo);\n  };\n\n  // Reset all data to initial demo state\n  const handleResetDemoData = () => {\n    setSekolahInfo(DEFAULT_SEKOLAH_INF endance={(ids) => {\n                const attType = `eskul_${selectedEskulId}`;\n                const current = getAttendanceForDate(attType, selectedDateEskul);\n                ids.forEach(id => delete current[id]);\n                saveAttendanceForDate(attType, selectedDateEskul, current);\n                setAttEskul({ ...current });\n                saveAttendanceCloud(attType, selectedDateEskul, current);\n              }}\n              onShowToast={showToast}\n              onOpenScanner={() => setIsScannerOpen(true)}\n              onOpenBarcodeCard={(person) => openBarcodeCard(person)}\n            />\n          )}\n\n          {(activeView === 'kelola' || activeView === 'rekap') && (\n            <ViewKelolaData\n              sekolahInfo={sekolahInfo}\n              onSaveSekolahInfo={handleSaveSekolahInfo}\n              roster={roster}\n              onSaveRoster={handleSaveRoster}\n              onResetDemoData={handleResetDemoData}\n              onClearAllData={handleClearAllData}\n              onShowToast={showToast}\n              todayDateStr={todayStr}\n              initialTab={activeView === 'rekap' ? 'rekap' : 'master'}\n              onAttendanceReset={() => {\n                setAttSiswa(getAttendanceForDate('siswa', selectedDateSiswa));\n                setAttGuru(getAttendanceForDate('guru', selectedDateGuru));\n                if (selectedEskulId) {\n                  setAttEskul(getAttendanceForDate(`eskul_${selectedEskulId}`, selectedDateEskul));\n                }\n              }}\n            />\n          )}\n\n        </div>\n      </main>\n\n      {/* Barcode Scanner Modal */}\n      <BarcodeScannerModal\n        isOpen={isScannerOpen}\n        onClose={() => setIsScannerOpen(false)}\n        roster={roster}\n        selectedDate={activeView === 'eskul' ? selectedDateEskul : todayStr}\n        onStampAttendance={(personId, role, status) => {\n          if (activeView === 'eskul' && selectedEskulId) {\n            const attType = `eskul_${selectedEskulId}`;\n            const updated = updateAttendanceStatus(attType, selectedDateEskul, personId, status);\n            setAttEskul(updated);\n            saveAttendanceCloud(attType, selectedDateEskul, updated);\n          } else {\n            handleStampStatus(role, personId, status);\n          }\n        }}\n        onShowToast={showToast}\n      />\n\n      {/* Barcode Member Card Printable Modal */}\n      <BarcodeCardModal\n        isOpen={barcodeCardModal.isOpen}\n        onClose={() => setBarcodeCardModal({ isOpen: false, person: null })}\n        roster={roster}\n        sekolahNama={sekolahInfo.nama}\n        sekolahInfo={sekolahInfo}\n        onSaveSekolahInfo={handleSaveSekolahInfo}\n        onSaveRoster={handleSaveRoster}\n        initialPerson={barcodeCardModal.person}\n      />\n\n      {/* Bottom Navigation Menu */}\n      <BottomNav\n        activeView={activeView}\n        onNavigate={setActiveView}\n        onOpenScanner={() => setIsScannerOpen(true)}\n      />\n    </div>\n  );\n}\n\n\nReactDOMClient.createRoot(document.getElementById('root')).render(React.createElement(App));\n";
