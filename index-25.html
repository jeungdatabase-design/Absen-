                        className=\"bg-[#1F3D2E] text-white font-semibold text-xs px-3.5 py-1 rounded-lg hover:bg-[#193326] transition flex items-center gap-1 cursor-pointer\"\n                            >\n                              <Save className=\"w-3.5 h-3.5\" />\n                              <span>Simpan</span>\n                            </button>\n                          </div>\n                        </div>\n                      );\n                    }\n\n                    return (\n                      <div key={esk.id} className=\"py-2.5 px-1 flex items-center justify-between gap-2 text-xs\">\n                        <div className=\"space-y-1\">\n                          <div className=\"flex flex-wrap items-center gap-2\">\n                            <span className=\"font-bold text-[#22303F] text-sm\">{esk.nama}</span>\n                            {esk.hari && (\n                              <span className=\"bg-[#E4F3EA] text-[#1F7A4C] font-semibold text-[10px] px-2 py-0.5 rounded-full border border-[#1F7A4C]/20\">\n                                📅 {esk.hari} {esk.jam ? `• ⏰ ${esk.jam}` : ''}\n                              </span>\n                            )}\n                            <span className=\"bg-[#FFF4E5] text-[#B5730E] border border-[#F6AD55]/40 font-bold px-2 py-0.5 rounded-full text-[10px]\">\n                              💰 Honor: Rp {(esk.tarifPerSesi || 125000).toLocaleString('id-ID')}/sesi\n                            </span>\n                          </div>\n                          {assignedTeachers.length > 0 ? (\n                            <p className=\"text-[11px] text-[#22303F] font-medium\">\n                              👨‍🏫 Pembina: <span className=\"text-[#B5730E] font-bold\">{assignedTeachers.map(t => t.nama).join(', ')}</span>\n                            </p>\n                          ) : esk.pembina ? (\n                            <p className=\"text-[#5B6B7A] text-[11px]\">\n                              Pembina: <span className=\"font-medium text-[#22303F]\">{esk.pembina}</span>\n                            </p>\n                          ) : (\n                            <p className=\"text-[#5B6B7A] text-[11px] italic\">Belum ada pembina ditentukan (Atur di Kelola Guru)</p>\n                          )}\n                        </div>\n                        <div className=\"flex items-center gap-1 shrink-0\">\n                          <button\n                            onClick={() => handleStartEditEskul(esk)}\n                            className=\"text-xs text-[#1F3D2E] hover:bg-[#E4F3EA] p-1.5 rounded transition cursor-pointer\"\n                            title=\"Edit Ekstrakurikuler\"\n                          >\n                            <Edit3 className=\"w-4 h-4\" />\n                          </button>\n                          <button\n                            onClick={() => handleDeleteEskul(esk.id, esk.nama)}\n                            className=\"text-xs text-[#C23B3B] hover:bg-[#FBE6E6] p-1.5 rounded transition cursor-pointer\"\n                            title=\"Hapus Ekstrakurikuler\"\n                          >\n                            <Trash2 className=\"w-4 h-4\" />\n                          </button>\n                        </div>\n                      </div>\n                    );\n                  })\n                )}\n              </div>\n            </div>\n\n            <div className=\"flex justify-end pt-3 border-t border-[#EDE8DC] shrink-0\">\n              <button\n                type=\"button\"\n                onClick={() => setActiveModal(null)}\n                className=\"bg-[#1F3D2E] text-white font-semibold text-xs px-5 py-2 rounded-lg hover:bg-[#193326] cursor-pointer\"\n              >\n                Tutup\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* 6. MODAL FILTER & PRATINJAU CSV MAPPER */}\n      {showCsvMapperModal && (\n        <div className=\"fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-2 sm:p-4\">\n          <div className=\"bg-white border-2 border-[#EDE8DC] rounded-2xl max-w-3xl w-full p-4 sm:p-6 shadow-2xl max-h-[92vh] flex flex-col\">\n            {/* Header */}\n            <div className=\"flex items-center justify-between border-b border-[#EDE8DC] pb-3 shrink-0\">\n              <div>\n                <h3 className=\"font-kalam font-bold text-lg text-[#22303F] flex items-center gap-2\">\n                  <FileSpreadsheet className=\"w-5 h-5 text-[#1F7A4C]\" />\n                  <span>Filter & Pilih Kolom CSV Siswa</span>\n                </h3>\n                <p className=\"text-xs text-[#5B6B7A] mt-0.5\">\n                  Ditemukan <b>{csvRows.length}</b> baris data dan <b>{csvHeaders.length}</b> kolom. Pilih kolom yang dibutuhkan saja.\n                </p>\n              </div>\n              <button\n                onClick={() => setShowCsvMapperModal(false)}\n                className=\"w-8 h-8 rounded-full bg-[#F4F1E9] text-[#5B6B7A] hover:text-[#22303F] hover:bg-[#E1DACB] flex items-center justify-center transition cursor-pointer\"\n              >\n                <X className=\"w-4 h-4\" />\n              </button>\n            </div>\n\n            {/* Content */}\n            <div className=\"space-y-4 overflow-y-auto py-4 pr-1 flex-1\">\n              {/* Info Box */}\n              <div className=\"bg-[#EBF3FB] border border-[#2B6CB0]/30 rounded-xl p-3 text-xs text-[#1A365D] flex items-start gap-2.5\">\n                <Info className=\"w-4 h-4 text-[#2B6CB0] shrink-0 mt-0.5\" />\n                <div>\n                  <p className=\"font-bold\">Sistem mengambil data yang dibutuhkan secara presisi:</p>\n                  <p className=\"mt-0.5 text-[11px] text-[#2B6CB0]\">\n                    Pilih kolom Nama, NISN, Kelas, Tempat Lahir, dan Tanggal Lahir dari file CSV Anda. Kolom tak terpakai lainnya akan diabaikan secara aman.\n                  </p>\n                </div>\n              </div>\n\n              {/* Column Selectors Grid */}\n              <div className=\"grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2.5 bg-[#FAF8F5] p-3 rounded-xl border border-[#EDE8DC]\">\n                {/* 1. Kolom Nama */}\n                <div>\n                  <label className=\"text-[11px] font-bold text-[#22303F] block mb-1\">\n                    1. Nama Siswa <span className=\"text-[#C23B3B]\">*</span>\n                  </label>\n                  <select\n                    value={mappedColNama}\n                    onChange={(e) => setMappedColNama(Number(e.target.value))}\n                    className=\"w-full bg-white border border-[#E1DACB] rounded-lg p-1.5 text-xs font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    {csvHeaders.map((h, idx) => (\n                      <option key={idx} value={idx}>\n                        Kolom {idx + 1}: {h || `(Tanpa Judul ${idx + 1})`}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n\n                {/* 2. Kolom NISN */}\n                <div>\n                  <label className=\"text-[11px] font-bold text-[#22303F] block mb-1\">\n                    2. NISN\n                  </label>\n                  <select\n                    value={mappedColNis}\n                    onChange={(e) => setMappedColNis(Number(e.target.value))}\n                    className=\"w-full bg-white border border-[#E1DACB] rounded-lg p-1.5 text-xs font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    <option value={-1}>-- Abaikan --</option>\n                    {csvHeaders.map((h, idx) => (\n                      <option key={idx} value={idx}>\n                        Kolom {idx + 1}: {h || `(Tanpa Judul ${idx + 1})`}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n\n                {/* 3. Kolom Kelas */}\n                <div>\n                  <label className=\"text-[11px] font-bold text-[#22303F] block mb-1\">\n                    3. Kelas / Rombel\n                  </label>\n                  <select\n                    value={mappedColKelas}\n                    onChange={(e) => setMappedColKelas(Number(e.target.value))}\n                    className=\"w-full bg-white border border-[#E1DACB] rounded-lg p-1.5 text-xs font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    <option value={-1}>-- Default Kelas --</option>\n                    {csvHeaders.map((h, idx) => (\n                      <option key={idx} value={idx}>\n                        Kolom {idx + 1}: {h || `(Tanpa Judul ${idx + 1})`}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n\n                {/* 4. Kolom Tempat Lahir */}\n                <div>\n                  <label className=\"text-[11px] font-bold text-[#22303F] block mb-1\">\n                    4. Tempat Lahir\n                  </label>\n                  <select\n                    value={mappedColTempatLahir}\n                    onChange={(e) => setMappedColTempatLahir(Number(e.target.value))}\n                    className=\"w-full bg-white border border-[#E1DACB] rounded-lg p-1.5 text-xs font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    <option value={-1}>-- Abaikan --</option>\n                    {csvHeaders.map((h, idx) => (\n                      <option key={idx} value={idx}>\n                        Kolom {idx + 1}: {h || `(Tanpa Judul ${idx + 1})`}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n\n                {/* 5. Kolom Tanggal Lahir */}\n                <div>\n                  <label className=\"text-[11px] font-bold text-[#22303F] block mb-1\">\n                    5. Tanggal Lahir\n                  </label>\n                  <select\n                    value={mappedColTanggalLahir}\n                    onChange={(e) => setMappedColTanggalLahir(Number(e.target.value))}\n                    className=\"w-full bg-white border border-[#E1DACB] rounded-lg p-1.5 text-xs font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                  >\n                    <option value={-1}>-- Abaikan --</option>\n                    {csvHeaders.map((h, idx) => (\n                      <option key={idx} value={idx}>\n                        Kolom {idx + 1}: {h || `(Tanpa Judul ${idx + 1})`}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n              </div>\n\n              {/* Fallback Kelas if Kolom Kelas is -1 or missing */}\n              {mappedColKelas === -1 && (\n                <div className=\"bg-[#FFF4E5] border border-[#F6AD55]/40 p-3 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2\">\n                  <span className=\"text-xs font-bold text-[#B5730E]\">Pilih Kelas Target untuk Seluruh Siswa di File Ini:</span>\n                  <div className=\"flex items-center gap-2\">\n                    <select\n                      value={fallbackKelas}\n                      onChange={(e) => setFallbackKelas(e.target.value)}\n                      className=\"bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none\"\n                    >\n                      {roster.classes.map(k => (\n                        <option key={k} value={k}>Kelas {k}</option>\n                      ))}\n                    </select>\n                    <input\n                      type=\"text\"\n                      placeholder=\"Atau Ketik Kelas Baru...\"\n                      value={fallbackKelas}\n                      onChange={(e) => setFallbackKelas(e.target.value.toUpperCase())}\n                      className=\"bg-white border border-[#E1DACB] rounded-lg px-2.5 py-1.5 text-xs font-bold text-[#22303F] w-36 focus:outline-none\"\n                    />\n                  </div>\n                </div>\n              )}\n\n              {/* Data Preview Table */}\n              <div className=\"space-y-1.5\">\n                <div className=\"flex items-center justify-between\">\n                  <span className=\"text-xs font-bold text-[#22303F]\">Pratinjau Hasil Impor (5 Baris Pertama):</span>\n                  <span className=\"text-[11px] text-[#5B6B7A]\">Total siswa valid: {csvRows.filter(r => r[mappedColNama]?.trim()).length}</span>\n                </div>\n\n                <div className=\"border border-[#EDE8DC] rounded-xl overflow-hidden bg-white overflow-x-auto\">\n                  <table className=\"w-full text-left text-xs min-w-[500px]\">\n                    <thead className=\"bg-[#FAF8F5] border-b border-[#EDE8DC] text-[#5B6B7A] font-bold\">\n                      <tr>\n                        <th className=\"py-2 px-3 w-10 text-center\">#</th>\n                        <th className=\"py-2 px-3\">Nama Siswa</th>\n                        <th className=\"py-2 px-3\">NISN</th>\n                        <th className=\"py-2 px-3\">Kelas</th>\n                        <th className=\"py-2 px-3\">Tempat Lahir</th>\n                        <th className=\"py-2 px-3\">Tanggal Lahir</th>\n                      </tr>\n                    </thead>\n                    <tbody className=\"divide-y divide-[#EDE8DC]\">\n                      {csvRows.slice(0, 6).map((row, idx) => {\n                        const namaVal = row[mappedColNama]?.trim() || '';\n                        const nisRaw = mappedColNis !== -1 && row[mappedColNis] ? row[mappedColNis].trim() : '-';\n                        const cleanNisPrev = nisRaw !== '-' ? nisRaw.replace(/^(nisn|nis)[\\.\\s:]*/i, '').trim() : '';\n                        const nisNip = cleanNisPrev ? `NISN. ${cleanNisPrev}` : '-';\n                        const kelasVal = mappedColKelas !== -1 && row[mappedColKelas] ? row[mappedColKelas].trim().toUpperCase() : fallbackKelas.toUpperCase();\n                        const rawTmp = mappedColTempatLahir !== -1 && row[mappedColTempatLahir] ? row[mappedColTempatLahir].trim() : '';\n                        const rawTgl = mappedColTanggalLahir !== -1 && row[mappedColTanggalLahir] ? row[mappedColTanggalLahir].trim() : '';\n                        const parsedTtl = parseTtlValue(rawTmp, rawTgl);\n\n                        return (\n                          <tr key={idx} className={!namaVal ? 'bg-red-50/50 text-[#8C9BA5]' : 'hover:bg-[#FAF8F5]'}>\n                            <td className=\"py-2 px-3 text-center text-[#8C9BA5] font-jetbrains\">{idx + 1}</td>\n                            <td className=\"py-2 px-3 font-bold text-[#22303F]\">\n                              {namaVal || <span className=\"italic text-red-500\">(Kosong - Akan Dilewati)</span>}\n                            </td>\n                            <td className=\"py-2 px-3 font-jetbrains text-[#5B6B7A]\">{nisNip}</td>\n                            <td className=\"py-2 px-3 font-bold text-[#1F3D2E]\">Kelas {kelasVal || '1A'}</td>\n                            <td className=\"py-2 px-3 text-[#5B6B7A]\">{parsedTtl.tempatLahir || '-'}</td>\n                            <td className=\"py-2 px-3 text-[#5B6B7A]\">{parsedTtl.tanggalLahir || '-'}</td>\n                          </tr>\n                        );\n                      })}\n                    </tbody>\n                  </table>\n                </div>\n              </div>\n            </div>\n\n            {/* Footer buttons */}\n            <div className=\"flex items-center justify-between pt-3 border-t border-[#EDE8DC] shrink-0\">\n              <button\n                type=\"button\"\n                onClick={() => setShowCsvMapperModal(false)}\n                className=\"bg-[#E1DACB] text-[#5B6B7A] font-semibold text-xs px-4 py-2 rounded-lg hover:bg-[#d5cebe] transition cursor-pointer\"\n              >\n                Batal\n              </button>\n              <button\n                type=\"button\"\n                onClick={handleConfirmImportCsv}\n                className=\"bg-[#1F7A4C] hover:bg-[#18623d] text-white font-bold text-xs px-5 py-2 rounded-lg shadow-md transition flex items-center gap-2 cursor-pointer\"\n              >\n                <Upload className=\"w-4 h-4\" />\n                <span>Impor {csvRows.filter(r => r[mappedColNama]?.trim()).length} Data Siswa Lengkap</span>\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* POPUP FORMULIR DATA GURU */}\n      {isTeacherFormOpen && (\n        <div className=\"fixed inset-0 bg-black/60 backdrop-blur-xs z-[60] flex items-center justify-center p-0 sm:p-4 animate-in fade-in duration-150\">\n          <div className=\"bg-white w-full h-full sm:h-auto sm:max-h-[92vh] sm:max-w-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden\">\n            {/* Header Modal */}\n            <div className=\"bg-[#1F3D2E] text-white p-4 sm:p-5 flex items-center justify-between shrink-0 shadow-sm\">\n              <div className=\"flex items-center gap-3\">\n                <div className=\"w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-lg\">\n                  {teacherFormMode === 'add' ? '👤+' : '✏️'}\n                </div>\n                <div>\n                  <h3 className=\"font-kalam font-bold text-base sm:text-lg text-white\">\n                    {teacherFormMode === 'add' ? 'Formulir Tambah Data Guru Baru' : `Edit Data Guru: ${namaGuruInput || 'Guru'}`}\n                  </h3>\n                  <p className=\"text-xs text-[#E4F3EA]\">\n                    Isi lengkap identitas, honor harian, jadwal mengajar & piket guru.\n                  </p>\n                </div>\n              </div>\n              <button\n                type=\"button\"\n                onClick={() => setIsTeacherFormOpen(false)}\n                className=\"w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer shrink-0\"\n                title=\"Tutup Formulir\"\n              >\n                <X className=\"w-5 h-5\" />\n              </button>\n            </div>\n\n            {/* Content Form Scrollable */}\n            <form onSubmit={handleSubmitTeacherForm} className=\"flex-1 overflow-y-auto p-4 sm:p-6 space-y-4\">\n              {/* Section 1: Identitas Guru */}\n              <div className=\"bg-[#FAF8F5] border border-[#EDE8DC] rounded-xl p-3.5 sm:p-4 space-y-3\">\n                <h4 className=\"font-bold text-xs text-[#1F3D2E] uppercase tracking-wider flex items-center gap-2\">\n                  <span>📋 1. Identitas & Mata Pelajaran</span>\n                </h4>\n\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3\">\n                  {/* Pas Foto 3x4 Field */}\n                  <div className=\"sm:col-span-2 bg-white border border-[#E1DACB] rounded-xl p-3 flex items-center gap-3\">\n                    <div className=\"w-12 h-16 rounded-lg border-2 border-dashed border-[#1F3D2E]/40 bg-[#FAF8F5] overflow-hidden shrink-0 flex items-center justify-center relative\">\n                      {fotoGuruInput ? (\n                        <img src={fotoGuruInput} alt=\"Pas Foto\" className=\"w-full h-full object-cover\" />\n                      ) : (\n                        <UserCheck className=\"w-6 h-6 text-[#1F3D2E]/50\" />\n                      )}\n                    </div>\n                    <div className=\"flex-1 min-w-0\">\n                      <label className=\"text-xs font-bold text-[#22303F] block mb-0.5\">\n                        Pas Foto 3x4 Guru\n                      </label>\n                      <p className=\"text-[11px] text-[#5B6B7A] mb-1.5\">\n                        Format JPG/PNG, otomatis dioptimalkan agar ringan & hemat penyimpanan database.\n                      </p>\n                      <div className=\"flex items-center gap-2\">\n                        <input\n                          type=\"file\"\n                          ref={fileInputModalTeacherPhotoRef}\n                          accept=\"image/*\"\n                          onChange={handleModalTeacherPhotoChange}\n                          className=\"hidden\"\n                        />\n                        <button\n                          type=\"button\"\n                          onClick={() => fileInputModalTeacherPhotoRef.current?.click()}\n                          className=\"bg-[#1F3D2E] text-white hover:bg-[#183225] px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition cursor-pointer\"\n                        >\n                          <ImageIcon className=\"w-3.5 h-3.5\" />\n                          <span>{fotoGuruInput ? 'Ganti Pas Foto' : 'Unggah Pas Foto'}</span>\n                        </button>\n                        {fotoGuruInput && (\n                          <button\n                            type=\"button\"\n                            onClick={() => setFotoGuruInput('')}\n                            className=\"bg-[#FBE6E6] text-[#C23B3B] hover:bg-[#f7d4d4] px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer\"\n                          >\n                            Hapus Foto\n                          </button>\n                        )}\n                      </div>\n                    </div>\n                  </div>\n\n                  <div>\n                    <label className=\"text-xs font-bold text-[#22303F] block mb-1\">\n                      Nama Lengkap & Gelar <span className=\"text-[#C23B3B]\">*</span>\n                    </label>\n                    <input\n                      type=\"text\"\n                      required\n                      value={namaGuruInput}\n                      onChange={(e) => setNamaGuruInput(e.target.value)}\n                      placeholder=\"Contoh: Drs. H. Ahmad Syaikhu, M.Pd.\"\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-[#22303F] focus:outline-none focus:border-[#1F3D2E] focus:ring-1 focus:ring-[#1F3D2E]\"\n                    />\n                  </div>\n\n                  <div>\n                    <label className=\"text-xs font-bold text-[#22303F] block mb-1\">\n                      NIP Guru (Opsional)\n                    </label>\n                    <input\n                      type=\"text\"\n                      value={nipGuruInput}\n                      onChange={(e) => setNipGuruInput(e.target.value)}\n                      placeholder=\"Contoh: 198005122006041002\"\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-[#22303F] focus:outline-none focus:border-[#1F3D2E] focus:ring-1 focus:ring-[#1F3D2E]\"\n                    />\n                  </div>\n\n                  <div>\n                    <label className=\"text-xs font-bold text-[#22303F] block mb-1\">\n                      Mata Pelajaran / Jabatan\n                    </label>\n                    <input\n                      type=\"text\"\n                      value={mapelGuruInput}\n                      onChange={(e) => setMapelGuruInput(e.target.value)}\n                      placeholder=\"Contoh: Fiqih / Bahasa Arab\"\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-[#22303F] focus:outline-none focus:border-[#1F3D2E] focus:ring-1 focus:ring-[#1F3D2E]\"\n                    />\n                  </div>\n\n                  <div>\n                    <label className=\"text-xs font-bold text-[#22303F] block mb-1\">\n                      Honor Harian (Rp)\n                    </label>\n                    <div className=\"relative\">\n                      <span className=\"absolute left-3 top-2.5 text-xs sm:text-sm font-bold text-[#5B6B7A]\">Rp</span>\n                      <input\n                        type=\"text\"\n                        inputMode=\"numeric\"\n                        value={tarifGuruInput}\n                        onChange={(e) => {\n                          const val = e.target.value.replace(/[^0-9]/g, '');\n                          setTarifGuruInput(val);\n                        }}\n                        placeholder=\"150000\"\n                        className=\"w-full bg-white border border-[#E1DACB] rounded-xl pl-9 pr-3 py-2.5 text-xs sm:text-sm font-jetbrains text-[#22303F] focus:outline-none focus:border-[#1F3D2E] focus:ring-1 focus:ring-[#1F3D2E]\"\n                      />\n                    </div>\n                  </div>\n                </div>\n              </div>\n\n              {/* Section 2: Jadwal Hari Mengajar */}\n              <div className=\"bg-[#FAF8F5] border border-[#EDE8DC] rounded-xl p-3.5 sm:p-4 space-y-2\">\n                <h4 className=\"font-bold text-xs text-[#1F3D2E] uppercase tracking-wider flex items-center justify-between\">\n                  <span>📅 2. Jadwal Hari Mengajar</span>\n                  <span className=\"text-[11px] text-[#5B6B7A] font-normal\">Pilih hari aktif mengajar</span>\n                </h4>\n\n                <div className=\"grid grid-cols-2 sm:grid-cols-6 gap-2 pt-1\">\n                  {HARI_DALAM_SEMINGGU.map(hari => {\n                    const isSelected = jadwalGuruInput.includes(hari);\n                    return (\n                      <button\n                        key={hari}\n                        type=\"button\"\n                        onClick={() => toggleJadwalHari(hari)}\n );\n      } else {\n        const updatedTeachers = roster.teachers.map(t => t.id === targetPersonForPhoto.id ? { ...t, fotoUrl: base64 } : t);\n        if (onSaveRoster) onSaveRoster({ ...roster, teachers: updatedTeachers });\n      }\n    };\n    reader.readAsDataURL(file);\n    if (e.target) e.target.value = '';\n  };\n\n  const cardContainerRef = useRef<HTMLDivElement>(null);\n\n  if (!isOpen) return null;\n\n  const allPeople: Person[] = [...roster.students, ...roster.teachers];\n\n  // Determine people list to show\n  let displayedPeople: Person[] = [];\n\n  if (initialPerson) {\n    displayedPeople = [initialPerson];\n  } else if (selectedSingleId) {\n    const p = allPeople.find(x => x.id === selectedSingleId);\n    displayedPeople = p ? [p] : [];\n  } else if (selectedFilter === 'guru') {\n    displayedPeople = roster.teachers;\n  } else if (selectedFilter.startsWith('kelas_')) {\n    const kName = selectedFilter.replace('kelas_', '');\n    displayedPeople = roster.students.filter(s => s.kelas === kName);\n  } else {\n    // all_siswa\n    displayedPeople = roster.students;\n  }\n\n  // Filter by search query if present\n  if (searchQuery.trim()) {\n    const q = searchQuery.toLowerCase();\n    displayedPeople = displayedPeople.filter(p =>\n      p.nama.toLowerCase().includes(q) || (p.nisNip && p.nisNip.toLowerCase().includes(q))\n    );\n  }\n\n  // Direct PNG Image Download to User's Device (Laptop/HP)\n  const handleDownloadPng = async () => {\n    if (isExportingPdf) return;\n\n    const cards = Array.from(document.querySelectorAll('.card-print-item')) as HTMLElement[];\n    if (cards.length === 0) {\n      alert('Tidak ada kartu yang dapat diunduh.');\n      return;\n    }\n\n    const dateStr = new Date().toISOString().split('T')[0];\n    const categoryName = selectedFilter === 'guru' ? 'Guru' : selectedSingleId ? 'Individual' : 'Siswa';\n    const sideName = cardSide === 'both' ? '2Sisi_OSIS' : cardSide === 'front' ? 'Presensi' : 'OSIS';\n    const f aveSekolahInfo && sekolahInfo) {\n                    onSaveSekolahInfo({\n                      ...sekolahInfo,\n                      stempelUrl: stampInput,\n                      kepalaSekolah: kepalaInput,\n                      nipKepalaSekolah: nipInput,\n                      npsn: npsnQuickInput\n                    });\n                  }\n                  setShowStampModal(false);\n                }}\n                className=\"bg-[#1F3D2E] text-white font-bold text-xs px-5 py-2 rounded-lg hover:bg-[#193326] flex items-center gap-1.5 shadow-xs cursor-pointer\"\n              >\n                <BadgeCheck className=\"w-4 h-4 text-amber-300\" />\n                <span>Terapkan Ke Kartu</span>\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* Hidden File Input for Individual Pas Foto 3x4 */}\n      <input\n        type=\"file\"\n        ref={fileInputPersonPhotoRef}\n        accept=\"image/*\"\n        onChange={handlePersonPhotoChange}\n        className=\"hidden\"\n      />\n    </div>\n  );\n};\n\n\n// ===== src/components/ViewAbsenSiswa.tsx =====\n\n\n\n\ninterface ViewAbsenSiswaProps {\n  roster: Roster;\n  selectedKelas: string;\n  onSelectKelas: (kelas: string) => void;\n  selectedDate: string;\n  onSelectDate: (dateStr: string) => void;\n  attendanceMap: DailyAttendanceMap;\n  onStampStatus: (studentId: string, status: AttendanceStatus | null, note?: string) => void;\n  onBulkStamp: (studentIds: string[], status: AttendanceStatus) => void;\n  onResetAttendance: (studentIds: string[]) => void;\n  onShowToast: (msg: string) => void;\n  onOpenScanner?: () => void;\n  onOpenBarcodeCard?: (person?: Person) => void;\n}\n\nconst ViewAbsenSiswa: React.FC<ViewAbsenSiswaProps> = ({\n  roster,\n  selectedKelas,\n  onSelectKelas,\n  selectedDate,\n  onSelectDate,\n  attendanceMap,\n  onStampStatus,\n  onBulkStamp,\n  onResetAttendance,\n  onShowToast,\n  onOpenScanner,\n  onOpenBarcodeCard\n}) => {\n  const [activeNoteInputId, setActiveNoteInputId] = useState<string | null>(null);\n  const [noteText, setNoteText] = useState<string>('');\n  const [searchQuery, setSearchQuery] = useState<string>('');\n\n  if (roster.classes.length === 0) {\n    return (\n      <div className=\"space-y-4\">\n        <h2 className=\"font-kalam text-2xl font-bold text-[#22303F]\">Absen Siswa 🧑‍🎓</h2>\n        <div className=\"bg-[#FEFDFB] border border-[#E1DACB] rounded-xl p-8 text-center text-[#5B6B7A]\">\n          Belum ada kelas terdaftar. Tambahkan kelas di menu Kelola Data terlebih dahulu.\n        </div>\n      </div>\n    );\n  }\n\n  const currentKelas = selectedKelas || roster.classes[0];\n  const studentsInClass = roster.students.filter(\n    s => s.kelas === currentKelas &&\n    (s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || (s.nisNip && s.nisNip.toLowerCase().includes(searchQuery.toLowerCase())))\n  );\n\n  const allClassStudentIds = roster.students.filter(s => s.kelas === currentKelas).map(s => s.id);\n\n  const statuses: { key: AttendanceStatus; label: string; activeClass: string }[] = [\n    { key: 'hadir', label: 'Hadir', activeClass: 'bg-[#E4F3EA] text-[#1F7A4C] border-[#1F7A4C]' },\n    { key: 'izin', label: 'Izin', activeClass: 'bg-[#FBF0DD] text-[#B5730E] border-[#B5730E]' },\n    { key: 'sakit', label: 'Sakit', activeClass: 'bg-[#F0E8F9] text-[#8B5FBF] border-[#8B5FBF]' },\n    { key: 'alpa', label: 'Alpa', activeClass: 'bg-[#FBE6E6] text-[#C23B3B] border-[#C23B3B]' },\n  ];\n\n  const handleNoteSave = (studentId: string) => {\n    const currentAtt = attendanceMap[studentId];\n    if (currentAtt) {\n      onStampStatus(studentId, currentAtt.status, noteText);\n      onShowToast('Keterangan disimpan');\n    } else {\n      onShowToast('Tandai status terlebih dahulu sebelum mengisi keterangan');\n    }\n    setActiveNoteInputId(null);\n  };\n\n  return (\n    <div className=\"space-y-3 sm:space-y-4\">\n      {/* Title */}\n      <div className=\"border-b border-[#EDE8DC] pb-2\">\n        <h2 className=\"font-kalam text-xl sm:text-2xl font-bold text-[#22303F] leading-tight\">Absen Siswa 🧑‍🎓</h2>\n      </div>\n\n      {/* Toolbar Controls */}\n      <div className=\"flex flex-col sm:flex-row gap-2 sm:gap-3 items-stretch sm:items-center justify-between bg-[#F4F1E9] p-2 sm:p-2.5 rounded-xl border border-[#EDE8DC]\">\n        <div className=\"grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2\">\n          {/* Class Selector */}\n          <div className=\"flex items-center gap-1.5 bg-white px-2.5 py-2 rounded-lg border border-[#E1DACB] shadow-2xs\">\n            <span className=\"text-xs font-bold text-[#5B6B7A] uppercase\">Kelas:</span>\n            <select\n              id=\"select-kelas-siswa\"\n              value={currentKelas}\n              onChange={(e) => onSelectKelas(e.target.value)}\n              className=\"bg-transparent text-xs sm:text-sm font-bold text-[#22303F] focus:outline-none cursor-pointer w-full\"\n            >\n              {roster.classes.map((k) => (\n                <option key={k} value={k}>\n                  Kelas {k}\n                </option>\n              ))}\n            </select>\n          </div>\n\n          {/* Date Selector */}\n          <div className=\"flex items-center gap-1.5 bg-white px-2.5 py-2 rounded-lg border border-[#E1DACB] shadow-2xs\">\n            <Calendar className=\"w-4 h-4 text-[#5B6B7A] flex-none\" />\n            <input\n              type=\"date\"\n              id=\"input-date-siswa\"\n              value={selectedDate}\n              onChange={(e) => onSelectDate(e.target.value)}\n              className=\"bg-transparent text-xs sm:text-sm font-semibold text-[#22303F] focus:outline-none cursor-pointer w-full\"\n            />\n          </div>\n        </div>\n\n        {/* Quick Bulk Actions */}\n        <div className=\"flex items-center gap-2 mt-1 sm:mt-0\">\n          <button\n            id=\"btn-bulk-hadir-siswa\"\n            onClick={() => >\n        {studentsInClass.length === 0 ? (\n          <div className=\"py-10 text-center text-[#5B6B7A] text-sm\">\n            {searchQuery ? 'Siswa tidak ditemukan.' : `Belum ada siswa di Kelas ${currentKelas}.`}\n          </div>\n        ) : (\n          studentsInClass.map((student, idx) => {\n            const att = attendanceMap[student.id];\n            const hasStatus = !!att;\n\n            return (\n              <div\n                key={student.id}\n                className=\"py-2.5 border-b border-dashed border-[#E7E1D2] flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:bg-[#F5F0E6]/30 px-2 rounded-lg transition\"\n              >\n                {/* Info Siswa */}\n                <div className=\"flex items-center gap-2.5 min-w-0\">\n                  <span className=\"font-jetbrains text-xs text-[#5B6B7A] w-6 font-bold flex-none\">\n                    {String(idx + 1).padStart(2, '0')}\n                  </span>\n                  <div className=\"min-w-0\">\n                    <div className=\"flex items-center gap-1.5\">\n                      <p className=\"font-bold text-sm text-[#22303F] truncate\">{student.nama}</p>\n                      {onOpenBarcodeCard && (\n                        <button\n                          onClick={() => onOpenBarcodeCard(student)}\n                          className=\"text-[#1F3D2E] hover:bg-[#E4F3EA] p-1 rounded transition cursor-pointer\"\n                          title=\"Lihat Kartu Barcode Siswa\"\n                        >\n                          <QrCode className=\"w-3.5 h-3.5\" />\n                        </button>\n                      )}\n                    </div>\n                    <div className=\"flex items-center gap-2 text-[11px] text-[#5B6B7A]\">\n                      {student.nisNip && <span className=\"font-jetbrains\">{student.nisNip}</span>}\n                      {att && (\n                        <span className=\"font-jetbrains text-[10px] bg-[#EDE8DC] px-1.5 py-0.2 rounded text-[#22303F]\">\n                          Jam: {att.jam}\n                        </span>\n                      )}\n                      {att?.keterangan && (\n                        <span className=\"text-[#B5730E] italic truncate max-w-[150px]\">\n                          ({att.keterangan})\n                        </span>\n                      )}\n                    </div>\n                  </div>\n                </div>\n\n                {/* Status Stamps & Note */}\n                <div className=\"flex items-center gap-1 sm:gap-1.5 w-full sm:w-auto justify-between sm:justify-start pt-1 sm:pt-0\">\n                  <div className=\"grid grid-cols-4 gap-1 flex-1 sm:flex-initial\">\n                    {statuses.map((st) => {\n                      const isStamped = att?.status === st.key;\n                      return (\n                        <button\n                          key={st.key}\n                          id={`stamp-${student.id}-${st.key}`}\n                          onClick={() => {\n                            const newStatus = isStamped ? null : st.key;\n                            onStampStatus(student.id, newStatus);\n                            if (newStatus) {\n                              onShowToast(`${student.nama}: ${st.label}`);\n                            } else {\n                              onShowToast('Status dihapus');\n                            }\n                          }}\n                          className={`font-kalam font-bold text-xs sm:text-xs py-1.5 sm:py-1 px-1 sm:px-2.5 rounded-md border-2 transition-transform cursor-pointer touch-manipulation min-h-[38px] sm:min-h-0 flex items-center justify-center ${\n                            isStamped\n                              ? `${st.activeClass} stamp-pop shadow-xs -rotate-1 font-extrabold`\n                              : 'bg-[#F4F1E9] text-[#7A7365] border-transparent hover:bg-[#EBE6DA]'\n                          }`}\n                        >\n                          {st.label}\n                        </button>\n                      );\n                    })}\n                  </div>\n\n                  {/* Note trigger */}\n                  <button\n                    onClick={() => {\n                      if (activeNoteInputId === student.id) {\n                        setActiveNoteInputId(null);\n                      } else {\n                        setActiveNoteInputId(student.id);\n                        setNoteText(att?.keterangan || '');\n                      }\n                    }}\n                    title=\"Tambah / edit keterangan\"\n                    className={`p-2 sm:p-1.5 rounded-md text-xs transition border flex-none min-h-[38px] min-w-[38px] sm:min-h-0 sm:min-w-0 flex items-center justify-center touch-manipulation ${\n                      att?.keterangan\n                        ? 'bg-[#FBF0DD] text-[#B5730E] border-[#B5730E]'\n                        : 'bg-[#F4F1E9] text-[#7A7365] border-transparent hover:text-[#22303F]'\n                    }`}\n                  >\n                    <MessageSquare className=\"w-4 h-4 sm:w-3.5 sm:h-3.5\" />\n                  </button>\n                </div>\n\n                {/* Inline Note Input */}\n                {activeNoteInputId === student.id && (\n                  <div className=\"w-full mt-2 flex items-center gap-2 bg-[#FBF0DD] p-2 rounded-lg border border-[#E1DACB]\">\n                    <input\n                      type=\"text\"\n                      placeholder=\"Masukkan alasan / keterangan (contoh: Surat sakit, Sakit demam)...\"\n                      value={noteText}\n                      onChange={(e) => setNoteText(e.target.value)}\n                      onKeyDown={(e) => {\n                        if (e.key === 'Enter') handleNoteSave(student.id);\n                      }}\n                      className=\"flex-1 text-xs bg-white px-2 py-1.5 rounded border border-[#E1DACB] text-[#22303F] focus:outline-none\"\n                    />\n                    <button\n                      onClick={() => handleNoteSave(student.id)}\n                      className=\"text-xs bg-[#1F3D2E] text-white px-2.5 py-1.5 rounded font-bold hover:bg-[#193326]\"\n                    >\n                      Simpan\n                    </button>\n                  </div>\n                )}\n              </div>\n            );\n          })\n        )}\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/components/ViewAbsenGuru.tsx =====\n\n\n\n\n\ninterface ViewAbsenGuruProps {\n  roster: Roster;\n  selectedDate: string;\n  onSelectDate: (dateStr: string) => void;\n  attendanceMap: DailyAttendanceMap;\n  onStampStatus: (teacherId: string, status: AttendanceStatus | null, note?: string) => void;\n  onBulkStamp: (teacherIds: string[], status: AttendanceStatus) => void;\n  onResetAttendance: (teacherIds: string[]) => void;\n  onShowToast: (msg: string) => void;\n  onOpenScanner?: () => void;\n  onOpenBarcodeCard?: (person?: Person) => void;\n}\n\nconst ViewAbsenGuru: React.FC<ViewAbsenGuruProps> = ({\n  roster,\n  selectedDate,\n  onSelectDate,\n  attendanceMap,\n  onStampStatus,\n  onBulkStamp,\n  onResetAttendance,\n  onShowToast,\n  onOpenScanner,\n  onOpenBarcodeCard\n}) => {\n  const [activeNoteInputId, setActiveNoteInputId] = useState<string | null>(null);\n  const [noteText, setNoteText] = useState<string>('');\n  const [searchQuery, setSearchQuery] = useState<string>('');\n  const [onlyScheduledToday, setOnlyScheduledToday] = useState<boolean>(true);\n  const [showPiketModal, setShowPiketModal] = useState<boolean>(false);\n\n  if (roster.teachers.length === 0) {\n    return (\n      <div className=\"space-y-4\">\n        <h2 className=\"font-kalam text-2xl font-bold text-[#22303F]\">Absen Guru & Staf 🧑‍🏫</h2>\n        <div className=\"bg-[#FEFDFB] border border-[#E1DACB] rounded-xl p-8 text-center text-[#5B6B7A]\">\n          Belum ada guru terdaftar. Tambahkan guru di menu Kelola Data terlebih dahulu.\n        </div>\n      </div>\n    );\n  }\n\n  const currentDayName = getDayNameFromDateString(selectedDate);\n\n  // Filter teachers by schedule if enabled\n  const teachersBySchedule = roster.teachers.filter(g => {\n    if (!onlyScheduledToday) return true;\n    const inHari = Array.isArray(g.jadwalHari) && g.jadwalHari.length > 0 ? g.jadwalHari.includes(currentDayName) : false;\n    const inPiket = Array.isArray(g.jadwalPiket) && g.jadwalPiket.includes(currentDayName);\n    return inHari || inPiket;\n  });\n\n  const filteredTeachers = teachersBySchedule.filter(\n    g => g.nama.toLowerCase().includes(searchQuery.toLowerCase()) ||\n    (g.nisNip && g.nisNip.toLowerCase().includes(searchQuery.toLowerCase())) ||\n    (g.mataPelajaran && g.mataPelajaran.toLowerCase().includes(searchQuery.toLowerCase()))\n  );\n\n  const activeTeacherIds = filteredTeachers.map(g => g.id);\n\n  const statuses: { key: AttendanceStatus; label: string; activeClass: string }[] = [\n    { key: 'hadir', label: 'Hadir', activeClass: 'bg-[#E4F3EA] text-[#1F7A4C] border-[#1F7A4C]' },\n    { key: 'izin', label: 'Izin', activeClass: 'bg-[#FBF0DD] text-[#B5730E] border-[#B5730E]' },\n    { key: 'sakit', label: 'Sakit', activeClass: 'bg-[#F0E8F9] text-[#8B5FBF] border-[#8B5FBF]' },\n    { key: 'alpa', label: 'Alpa', activeClass: 'bg-[#FBE6E6] text-[#C23B3B] border-[#C23B3B]' },\n  ];\n\n  const handleNoteSave = (teacherId: string) => {\n    const currentAtt = attendanceMap[teacherId];\n    if (currentAtt) {\n      onStampStatus(teacherId, currentAtt.status, noteText);\n      onShowToast('Keterangan disimpan');\n    } else {\n      onShowToast('Tandai status terlebih dahulu');\n    }\n    setActiveNoteInputId(null);\n  };\n\n  return (\n    <div className=\"space-y-3 sm:space-y-4\">\n      {/* Title */}\n      <div className=\"border-b border-[#EDE8DC] pb-2\">\n        <h2 className=\"font-kalam text-xl sm:text-2xl font-bold text-[#22303F] leading-tight
