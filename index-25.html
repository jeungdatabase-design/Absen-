4Str);\n    img.onload = () => {\n      let width = img.width;\n      let height = img.height;\n\n      if (width > maxWidth || height > maxHeight) {\n        const ratio = Math.min(maxWidth / width, maxHeight / height);\n        width = Math.round(width * ratio);\n        height = Math.round(height * ratio);\n      }\n\n      const canvas = document.createElement('canvas');\n      canvas.width = width;\n      canvas.height = height;\n\n      const ctx = canvas.getContext('2d');\n      if (!ctx) return resolve(base64Str);\n\n      ctx.fillStyle = '#FFFFFF';\n      ctx.fillRect(0, 0, width, height);\n      ctx.drawImage(img, 0, 0, width, height);\n\n      resolve(canvas.toDataURL('image/jpeg', quality));\n    };\n    img.src = base64Str;\n  });\n}\n\n\n// ===== src/utils/code128.ts =====\n// Code 128 B barcode generator returning SVG bars path\nconst CODE128_PATTERNS: string[] = [\n  '212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213',\n  '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132',\n  '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211',\n  '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313',\n  '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331',\n  '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111',\n  '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214',\n  '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111',\n  '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141',\n  '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141',\n  '114131', '311141', '411131', '211412', '211214', '211232', '2331112'\n];\n\nfunction encodeCode128B(text: string): string {\n  // Start Code B is index 104\n  const codeIndices: number[] = [104];\n  let checksum = 104;\n\n  for (let i = 0; i < text.length; i++) {\n    const code = text.charCodeAt(i) - 32;\n    const safeCode = code >= 0 && code <= 95 ? code : 31; // fallback to '?' if out of ASCII 32..127 range\n    codeIndices.push(safeCode);\n    checksum += safeCode * (i + 1);\n  }\n\n  const checkSymbol = checksum % 103;\n  codeIndices.push(checkSymbol);\n  codeIndices.push(106); // Stop symbol\n\n  let modules = '';\n  for (const idx of codeIndices) {\n    const pattern = CODE128_PATTERNS[idx];\n    if (!pattern) continue;\n    let isBar = true;\n    for (const char of pattern) {\n      const width = parseInt(char, 10);\n      modules += (isBar ? '1' : '0').repeat(width);\n      isBar = !isBar;\n    }\n  }\n\n  return modules;\n}\n\n\n// ===== src/components/BarcodeRenderer.tsx =====\n\n\n\ninterface BarcodeRendererProps {\n  value: string;\n  displayText?: string;\n  height?: number;\n  width?: number;\n  size?: number;\n  type?: 'barcode' | 'qr' | 'both';\n  isPortrait?: boolean;\n}\n\nconst BarcodeRenderer: React.FC<BarcodeRendererProps> = ({\n  value,\n  displayText,\n  size = 78,\n}) => {\n  const label = displayText || value;\n\n  return (\n    <div className=\"flex flex-col items-center justify-center p-1.5 bg-white rounded-xl border border-[#1F3D2E]/20 shadow-2xs\">\n      <QRCodeSVG value={value} size={size} level=\"M\" />\n      <span className=\"font-mono text-[8.5px] font-black text-[#1F3D2E] mt-0.5 tracking-wider\">{label}</span>\n    </div>\n  );\n};\n\n\n\n\n// ===== src/utils/storage.ts =====\n\n\n\n\nconst KEY_ROSTER = 'buku_absen_roster_v3';\nconst KEY_SEKOLAH = 'buku_absen_sekolah_v3';\nconst PREFIX_ATT = 'buku_absen_att_v2_';\n\nfunction loadSekolahInfo(): SekolahInfo {\n  try {\n    const saved = localStorage.getItem(KEY_SEKOLAH);\n    return saved ? JSON.parse(saved) : DEFAULT_SEKOLAH_INFO;\n  } catch {\n    return DEFAULT_SEKOLAH_INFO;\n  }\n}\n\nfunction saveSekolahInfo(info: SekolahInfo): void {\n  try {\n    localStorage.setItem(KEY_SEKOLAH, JSON.stringify(info));\n  } catch (e) {\n    console.error('Failed to save sekolah info', e);\n  }\n}\n\nfunction loadRoster(): Roster {\n  try {\n    const saved = localStorage.getItem(KEY_ROSTER);\n    if (saved) {\n      const parsed: Roster = JSON.parse(saved);\n      if (!parsed.teachers || parsed.teachers.length === 0) {\n        parsed.teachers = DEFAULT_ROSTER.teachers;\n        saveRoster(parsed);\n      }\n      return parsed;\n    }\n    saveRoster(DEFAULT_ROSTER);\n    return DEFAULT_ROSTER;\n  } catch {\n    return DEFAULT_ROSTER;\n  }\n}\n\nfunction saveRoster(roster: Roster): void {\n  try {\n    localStorage.setItem(KEY_ROSTER, JSON.stringify(roster));\n  } catch (e) {\n    console.error('Failed to save roster', e);\n  }\n}\n\nfunction getAttendanceForDate(type: string, dateStr: string): DailyAttendanceMap {\n  const key = `${PREFIX_ATT}${type}_${dateStr}`;\n  try {\n    const saved = localStorage.getItem(key);\n    if (saved) return JSON.parse(saved);\n    \n    // Seed today's demo attendance if empty\n    const todayStr = getTodayDateString();\n    if (dateStr === todayStr && (type === 'siswa' || type === 'guru')) {\n      const initial = generateInitialAttendance(todayStr);\n      const data = type === 'siswa' ? initial.siswa : initial.guru;\n      saveAttendanceForDate(type, dateStr, data);\n      return data;\n    }\n    return {};\n  } catch {\n    return {};\n  }\n}\n\nfunction saveAttendanceForDate(type: string, dateStr: string, data: DailyAttendanceMap): void {\n  const key = `${PREFIX_ATT}${type}_${dateStr}`;\n  try {\n    localStorage.setItem(key, JSON.stringify(data));\n  } catch (e) {\n    console.error('Failed to save attendance', e);\n  }\n}\n\nfunction updateAttendanceStatus(\n  type: string,\n  dateStr: string,\n  personId: string,\n  status: AttendanceStatus | null,\n  keterangan?: string\n): DailyAttendanceMap {\n  const current = getAttendanceForDate(type, dateStr);\n  if (status === null) {\n    delete current[personId];\n  } else {\n    const now = new Date();\n    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;\n    current[personId] = {\n      status,\n      jam: current[personId]?.jam || timeStr,\n      keterangan: keterangan ?? current[personId]?.keterangan ?? ''\n    };\n  }\n  saveAttendanceForDate(type, dateStr, current);\n  return { ...current };\n}\n\nfunction formatIndonesianDate(dateStr: string): string {\n  if (!dateStr) return '';\n  const [y, m, d] = dateStr.split('-').map(Number);\n  const date = new Date(y, m - 1, d);\n  return date.toLocaleDateString('id-ID', {\n    weekday: 'long',\n    day: 'numeric',\n    month: 'long',\n    year: 'numeric'\n  });\n}\n\nfunction getDateStringList(startDateStr: string, endDateStr: string): string[] {\n  const dates: string[] = [];\n  const start = new Date(startDateStr + 'T00:00:00');\n  const end = new Date(endDateStr + 'T00:00:00');\n  \n  if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) {\n    return [startDateStr];\n  }\n\n  const curr = new Date(start);\n  while (curr <= end) {\n    const y = curr.getFullYear();\n    const m = String(curr.getMonth() + 1).padStart(2, '0');\n    const d = String(curr.getDate()).padStart(2, '0');\n    dates.push(`${y}-${m}-${d}`);\n    curr.setDate(curr.getDate() + 1);\n  }\n  return dates;\n}\n\nfunction getWeekDateRange(refDateStr: string): { start: string; end: string } {\n  const d = new Date(refDateStr + 'T00:00:00');\n  if (isNaN(d.getTime())) {\n    return { start: refDateStr, end: refDateStr };\n  }\n  const dayOfWeek = d.getDay(); // 0 is Sun, 1 is Mon\n  const distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;\n  \n  const monday = new Date(d);\n  monday.setDate(d.getDate() + distanceToMonday);\n  \n  const sunday = new Date(monday);\n  sunday.setDate(monday.getDate() + 6);\n\n  const format = (dt: Date) => {\n    const y = dt.getFullYear();\n    const m = String(dt.getMonth() + 1).padStart(2, '0');\n    const day = String(dt.getDate()).padStart(2, '0');\n    return `${y}-${m}-${day}`;\n  };\n\n  return {\n    start: format(monday),\n    end: format(sunday)\n  };\n}\n\nfunction getMonthDateRange(year: number, month: number): { start: string; end: string } {\n  const mStr = String(month).padStart(2, '0');\n  const lastDay = new Date(year, month, 0).getDate();\n  const lStr = String(lastDay).padStart(2, '0');\n  return {\n    start: `${year}-${mStr}-01`,\n    end: `${year}-${mStr}-${lStr}`\n  };\n}\n\nfunction resetAttendanceForRange(\n  types: string[],\n  startDateStr: string,\n  endDateStr: string\n): { countDates: number; countRecordsReset: number } {\n  const dateList = getDateStringList(startDateStr, endDateStr);\n  let countRecordsReset = 0;\n\n  dateList.forEach((dStr) => {\n    types.forEach((type) => {\n      const key = `${PREFIX_ATT}${type}_${dStr}`;\n      const saved = localStorage.getItem(key);\n      if (saved) {\n        try {\n          const parsed = JSON.parse(saved);\n          countRecordsReset += Object.keys(parsed).length;\n        } catch {\n          // ignore\n        }\n      }\n      saveAttendanceForDate(type, dStr, {});\n      saveAttendanceCloud(type, dStr, {});\n    });\n  });\n\n  return {\n    countDates: dateList.length,\n    countRecordsReset\n  };\n}\n\n\n// ===== src/components/ViewRekap.tsx =====\n\n\n\n\n\n\n\ninterface ViewRekapProps {\n  roster: Roster;\n  todayDateStr: string;\n}\n\nconst ViewRekap: React.FC<ViewRekapProps> = ({ roster, todayDateStr }) => {\n  const [tipe, setTipe] = useState<'siswa' | 'guru' | 'eskul'>('siswa');\n  const [eskulSubTab, setEskulSubTab] = useState<'siswa' | 'guru'>('siswa');\n  const [selectedEskulId, setSelectedEskulId] = useState<string>(\n    (roster.eskuls && roster.eskuls.length > 0) ? roster.eskuls[0].id : (DEFAULT_ESKULS[0]?.id || 'esk_1')\n  );\n  const [selectedKelas, setSelectedKelas] = useState<string>('semua');\n  const [startDate, setStartDate] = useState<string>(todayDateStr);\n  const [endDate, setEndDate] = useState<string>(todayDateStr);\n\n  const eskulList = (roster.eskuls && roster.eskuls.length > 0) ? roster.eskuls : DEFAULT_ESKULS;\n  const currentEskul = eskulList.find(e => e.id === selectedEskulId) || eskulList[0];\n\n  const isTeacherReport = tipe === 'guru' || (tipe === 'eskul' && eskulSubTab === 'guru');\n\n  const [loading, setLoading] = useState<boolean>(false);\n  const [reportData, setReportData] = useState<{\n    people: Person[];\n    counts: Record<string, { hadir: number; izin: number; sakit: number; alpa: number }>;\n    totals: { hadir: number; izin: number; sakit: number; alpa: number };\n  }>({\n    people: [],\n    counts: {},\n    totals: { hadir: 0, izin: 0, sakit: 0, alpa: 0 }\n  });\n\n  // Calculate dates in range\n  const getDateArray = (start: string, end: string): string[] => {\n    const dates: string[] = [];\n    if (!start || !end) return dates;\n    let curr = new Date(start);\n    const last = new Date(end);\n    if (curr > last) return dates;\n\n    let count = 0;\n    while (curr <= last && count < 62) { // max 62 days safety limit\n      const y = curr.getFullYear();\n      const m = String(curr.getMonth() + 1).padStart(2, '0');\n      const d = String(curr.getDate()).padStart(2, '0');\n      dates.push(`${y}-${m}-${d}`);\n      curr.setDate(curr.getDate() + 1);\n      count++;\n    }\n    return dates;\n  };\n\n  const loadReport = () => {\n    setLoading(true);\n    const dates = getDateArray(startDate, endDate);\n\n    let people: Person[] = [];\n    let attType = tipe as string;\n\n    if (tipe === 'siswa') {\n      people = roster.students.filter(s => selectedKelas === 'semua' || s.kelas === selectedKelas);\n    } else if (tipe === 'guru') {\n      people = roster.teachers;\n    } else if (tipe === 'eskul') {\n      if (eskulSubTab === 'guru') {\n        people = roster.teachers;\n      } else {\n        people = roster.students.filter(s => selectedKelas === 'semua' || s.kelas === selectedKelas);\n      }\n      attType = `eskul_${selectedEskulId}`;\n    }\n\n    const counts: Record<string, { hadir: number; izin: number; sakit: number; alpa: number }> = {};\n    const totals = { hadir: 0, izin: 0, sakit: 0, alpa: 0 };\n\n    people.forEach(p => {\n      counts[p.id] = { hadir: 0, izin: 0, sakit: 0, alpa: 0 };\n    });\n\n    // Aggregate attendance per day\n    dates.forEach(dateStr => {\n      const att = getAttendanceForDate(attType, dateStr);\n      people.forEach(p => {\n        const entry = att[p.id];\n        if (entry && counts[p.id] && entry.status) {\n          counts[p.id][entry.status]++;\n          totals[entry.status]++;\n        }\n      });\n    });\n\n    setReportData({ people, counts, totals });\n    setLoading(false);\n  };\n\n  useEffect(() => {\n    loadReport();\n  }, [tipe, eskulSubTab, selectedEskulId, selectedKelas, startDate, endDate, roster]);\n\n  // Export to CSV\n  const handleExportCSV = () => {\n    let csvContent = 'data:text/csv;charset=utf-8,';\n    const subLabel = tipe === 'eskul' ? (eskulSubTab === 'guru' ? 'Guru/Pembina' : 'Siswa') : '';\n    const labelTitle = tipe === 'siswa' ? 'Siswa' : tipe === 'guru' ? 'Guru' : `Ekstrakurikuler (${currentEskul?.nama || ''} - ${subLabel})`;\n    csvContent += `Rekap Absensi ${labelTitle}\\n`;\n    csvContent += `Periode: ${startDate} s/d ${endDate}\\n\\n`;\n    \n    if (isTeacherReport) {\n      csvContent += 'No,Nama Guru/Pembina,NIP,Mata Pelajaran/Tugas,Hadir,Izin,Sakit,Alpa,Tarif Per Sesi (Rp),Total Honor Diterima (Rp)\\n';\n      reportData.people.forEach((p, i) => {\n        const c = reportData.counts[p.id] || { hadir: 0, izin: 0, sakit: 0, alpa: 0 };\n        const tarif = (tipe === 'eskul' && eskulSubTab === 'guru' && currentEskul?.tarifPerSesi !== undefined)\n          ? currentEskul.tarifPerSesi\n          : (p.tarifHarian !== undefined ? p.tarifHarian : 150000);\n        const totalGaji = c.hadir * tarif;\n        csvContent += `${i + 1},\"${p.nama}\",\"${p.nisNip || '-'}\",\"${p.mataPelajaran || '-'}\",${c.hadir},${c.izin},${c.sakit},${c.alpa},${tarif},${totalGaji}\\n`;\n      });\n    } else {\n      csvContent += 'No,Nama Siswa,NISN,Kelas,Hadir,Izin,Sakit,Alpa\\n';\n      reportData.people.forEach((p, i) => {\n        const c = reportData.counts[p.id] || { hadir: 0, izin: 0, sakit: 0, alpa: 0 };\n        csvContent += `${i + 1},\"${p.nama}\",\"${p.nisNip || '-'}\",\"${p.kelas || '-'}\",${c.hadir},${c.izin},${c.sakit},${c.alpa}\\n`;\n      });\n    }\n\n    const encodedUri = encodeURI(csvContent);\n    const link = document.createElement('a');\n    link.setAttribute('href', encodedUri);\n    link.setAttribute('download', `rekap_absen_${tipe}_${startDate}_sd_${endDate}.csv`);\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  const [isGeneratingPdf, setIsGeneratingPdf] = useState<boolean>(false);\n\n  const handlePrint = () => {\n    window.print();\n  };\n\n  const handleDownloadPDF = () => {\n    try {\n      setIsGeneratingPdf(true);\n\n      const doc = new jsPDF({\n        orientation: 'portrait',\n        unit: 'mm',\n        format: 'a4'\n      });\n\n      const pageWidth = doc.internal.pageSize.getWidth(); // 210mm\n      const pageHeight = doc.internal.pageSize.getHeight(); // 297mm\n      const margin = 12;\n      const contentWidth = pageWidth - (margin * 2); // 186mm\n\n      let y = 14;\n\n      // --- KOP SURAT / HEADER ---\n      doc.setFont('helvetica', 'bold');\n      doc.setFontSize(13);\n      doc.setTextColor(34, 48, 63); // #22303F\n\n      const subLabel = tipe === 'eskul' ? (eskulSubTab === 'guru' ? 'Guru/Pembina' : 'Siswa') : '';\n      const mainTitle = tipe === 'siswa' \n        ? 'REKAPITULASI PRESENSI KEHADIRAN SISWA' \n        : tipe === 'guru' \n        ? 'REKAPITULASI PRESENSI & HONORER GURU' \n        : `REKAPITULASI PRESENSI EKSTRAKURIKULER (${currentEskul?.nama || ''} - ${subLabel})`;\n\n      doc.text(mainTitle, pageWidth / 2, y, { align: 'center' });\n      y += 6;\n\n      doc.setFont('helvetica', 'normal');\n      doc.setFontSize(9);\n      doc.setTextColor(91, 107, 122); // #5B6B7A\n\n      let dateDetail = `Periode: ${formatIndonesianDate(startDate)} s/d ${formatIndonesianDate(endDate)}`;\n      if (tipe === 'siswa' && selectedKelas !== 'semua') {\n        dateDetail += ` • Kelas ${selectedKelas}`;\n      }\n      doc.text(dateDetail, pageWidth / 2, y, { align: 'center' });\n      y += 5;\n\n      // Decorative Line\n      doc.setDrawColor(31, 61, 46); // Dark green\n      doc.setLineWidth(0.6);\n      doc.line(margin, y, pageWidth - margin, y);\n      y += 6;\n\n      // --- RINGKASAN REKAPITULASI / STATS BOX ---\n      doc.setFillColor(244, 241, 233); // #F4F1E9\n      doc.roundedRect(margin, y, contentWidth, 13, 2, 2, 'F');\n\n      const totalGajiAll = reportData.people.reduce((sum, p) => {\n        const c = reportData.counts[p.id]?.hadir || 0;\n        const tarif = (tipe === 'eskul' && eskulSubTab === 'guru' && currentEskul?.tarifPerSesi !== undefined)\n          ? currentEskul.tarifPerSesi\n          : (p.tarifHarian !== undefined ? p.tarifHarian : 150000);\n        return sum + (c * tarif);\n      }, 0);\n\n      doc.setFont('helvetica', 'bold');\n      doc.setFontSize(8.5);\n\n      // Stats Column positions\n      doc.setTextColor(31, 122, 76);\n      doc.text(`Total Hadir: ${reportData.totals.hadir}`, margin + 5, y + 8);\n\n      doc.setTextColor(181, 115, 14);\n      doc.text(`Total Izin: ${reportData.totals.izin}`, margin + 40, y + 8);\n\n      doc.setTextColor(139, 95, 191);\n      doc.text(`Total Sakit: ${reportData.totals.sakit}`, margin + 75, y + 8);\n\n      doc.setTextColor(194, 59, 59);\n      doc.text(`Total Alpa: ${reportData.totals.alpa}`, margin + 110, y + 8);\n\n      if (isTeacherReport) {\n        doc.setTextColor(31, 61, 46);\n        doc.text(`Total Honor: Rp ${totalGajiAll.toLocaleString('id-ID')}`, margin + contentWidth - 5, y + 8, { align: 'right' });\n      }\n\n      y += 17;\n\n      // --- TABLE HEADERS & ROWS ---\n      let colWidths: number[] = [];\n      let headers: string[] = [];\n\n      if (isTeacherReport) {\n        colWidths = [10, 52, 38, 13, 13, 13, 13, 17, 17];\n        headers = ['No', 'Nama Lengkap', 'NIP / Mapel', 'Hadir', 'Izin', 'Sakit', 'Alpa', 'Tarif/Sesi', 'Total Honor'];\n      } else {\n        colWidths = [12, 74, 44, 14, 14, 14, 14];\n        headers = ['No', 'Nama Lengkap', 'NISN / Kelas', 'Hadir', 'Izin', 'Sakit', 'Alpa'];\n      }\n\n      const drawTableHeader = (currY: number) => {\n        doc.setFillColor(31, 61, 46); // Dark Green header\n        doc.rect(margin, currY, contentWidth, 7, 'F');\n\n        doc.setFont('helvetica', 'bold');\n        doc.setFontSize(8);\n        doc.setTextColor(255, 255, 255);\n\n        let xAcc = margin;\n        headers.forEach((h, idx) => {\n          const w = colWidths[idx];\n          const align = (idx >= 3 && idx <= 6) ? 'center' : (idx >= 7 ? 'right' : 'left');\n          let textX = xAcc + 2;\n          if (align === 'center') textX = xAcc + (w / 2);\n          if (align === 'right') textX = xAcc + w - 2;\n\n          doc.text(h, textX, currY + 4.8, { align });\n          xAcc += w;\n        });\n\n        return currY + 7;\n      };\n\n      y = drawTableHeader(y);\n\n      doc.setFont('helvetica', 'normal');\n      doc.setFontSize(8);\n\n      if (reportData.people.length === 0) {\n        doc.setTextColor(91, 107, 122);\n        doc.text('Tidak ada data untuk filter terpilih.', pageWidth / 2, y + 8, { align: 'center' });\n        y += 12;\n      } else {\n        reportData.people.forEach((p, idx) => {\n          if (y > pageHeight - 35) {\n            doc.addPage();\n            y = 14;\n            y = drawTableHeader(y);\n            doc.setFont('helvetica', 'normal');\n            doc.setFontSize(8);\n          }\n\n          const c = reportData.counts[p.id] || { hadir: 0, izin: 0, sakit: 0, alpa: 0 };\n          const tarif = (tipe === 'eskul' && eskulSubTab === 'guru' && currentEskul?.tarifPerSesi !== undefined)\n            ? currentEskul.tarifPerSesi\n            : (p.tarifHarian !== undefined ? p.tarifHarian : 150000);\n          const totalGaji = c.hadir * tarif;\n\n          if (idx % 2 === 1) {\n            doc.setFillColor(248, 246, 240);\n            doc.rect(margin, y, contentWidth, 6.5, 'F');\n          }\n\n          doc.setDrawColor(230, 225, 215);\n          doc.setLineWidth(0.2);\n          doc.line(margin, y + 6.5, margin + contentWidth, y + 6.5);\n\n          doc.setTextColor(34, 48, 63);\n\n          let xAcc = margin;\n          \n          doc.text(String(idx + 1), xAcc + 2, y + 4.5);\n          xAcc += colWidths[0];\n\n          const truncatedNama = p.nama.length > 28 ? p.nama.substring(0, 26) + '...' : p.nama;\n          doc.setFont('helvetica', 'bold');\n          doc.text(truncatedNama, xAcc + 2, y + 4.5);\n          doc.setFont('helvetica', 'normal');\n          xAcc += colWidths[1];\n\n          const subInfo = isTeacherReport \n            ? `${p.nisNip || '-'} (${p.mataPelajaran || '-'})`\n            : `${p.nisNip || '-'} (${p.kelas || '-'})`;\n          const truncatedSubInfo = subInfo.length > 22 ? subInfo.substring(0, 20) + '...' : subInfo;\n          doc.text(truncatedSubInfo, xAcc + 2, y + 4.5);\n          xAcc += colWidths[2];\n\n          doc.setTextColor(31, 122, 76);\n          doc.text(String(c.hadir), xAcc + (colWidths[3] / 2), y + 4.5, { align: 'center' });\n          xAcc += colWidths[3];\n\n          doc.setTextColor(181, 115, 14);\n          doc.text(String(c.izin), xAcc + (colWidths[4] / 2), y + 4.5, { align: 'center' });\n          xAcc += colWidths[4];\n\n          doc.setTextColor(139, 95, 191);\n          doc.text(String(c.sakit), xAcc + (colWidths[5] / 2), y + 4.5, { align: 'center' });\n          xAcc += colWidths[5];\n\n          doc.setTextColor(194, 59, 59);\n          doc.text(String(c.alpa), xAcc + (colWidths[6] / 2), y + 4.5, { align: 'center' });\n          xAcc += colWidths[6];\n\n          if (isTeacherReport) {\n            doc.setTextColor(91, 107, 122);\n            doc.text(`Rp ${tarif.toLocaleString('id-ID')}`, xAcc + colWidths[7] - 2, y + 4.5, { align: 'right' });\n            xAcc += colWidths[7];\n\n            doc.setTextColor(31, 122, 76);\n            doc.setFont('helvetica', 'bold');\n            doc.text(`Rp ${totalGaji.toLocaleString('id-ID')}`, xAcc + colWidths[8] - 2, y + 4.5, { align: 'right' });\n            doc.setFont('helvetica', 'normal');\n          }\n\n          y += 6.5;\n        });\n      }\n\n      // --- SIGNATURE SECTION ---\n      if (y > pageHeight - 40) {\n        doc.addPage();\n        y = 20;\n      } else {\n        y += 10;\n      }\n\n      doc.setFont('helvetica', 'normal');\n      doc.setFontSize(8.5);\n      doc.setTextColor(34, 48, 63);\n\n      const sigColWidth = contentWidth / 2;\n      \n      doc.text('Mengetahui,', margin + (sigColWidth / 2), y, { align: 'center' });\n      doc.setFont('helvetica', 'bold');\n      doc.text('Kepala Sekolah', margin + (sigColWidth / 2), y + 4.5, { align: 'center' });\n      doc.text('( ........................................ )', margin + (sigColWidth / 2), y + 22, { align: 'center' });\n\n      doc.setFont('helvetica', 'normal');\n      doc.text('Dibuat Oleh,', margin + sigColWidth + (sigColWidth / 2), y, { align: 'center' });\n      doc.setFont('helvetica', 'bold');\n      const authorRole = isTeacherReport ? 'Bendahara / Pengelola Guru' : 'Wali Kelas';\n      doc.text(authorRole, margin + sigColWidth + (sigColWidth / 2), y + 4.5, { align: 'center' });\n      doc.text('( ........................................ )', margin + sigColWidth + (sigColWidth / 2), y + 22, { align: 'center' });\n\n      // Save PDF to device\n      const fileName = `rekap_presensi_${tipe}_${startDate}_sd_${endDate}.pdf`;\n      doc.save(fileName);\n    } catch (err) {\n      console.error('Gagal membuat PDF:', err);\n      alert('Terjadi kesalahan saat membuat file PDF. Silakan coba lagi.');\n    } finally {\n      setIsGeneratingPdf(false);\n    }\n  };\n\n  return (\n    <div className=\"space-y-5 print:space-y-2\">\n      {/* Title */}\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#EDE8DC] pb-3\">\n        <div>\n          <h2 className=\"font-kalam text-2xl sm:text-3xl font-bold text-[#22303F]\">Rekap Absensi 📊</h2>\n        </div>\n\n        {/* Action Buttons - Single Row */}\n        <div className=\"flex items-center gap-2 shrink-0 print:hidden\">\n          <button\n            id=\"btn-download-rekap-pdf\"\n            onClick={handleDownloadPDF}\n            disabled={isGeneratingPdf}\n            className=\"text-xs font-bold bg-[#1F3D2E] text-white px-3 py-2 rounded-lg hover:bg-[#193326] transition flex items-center gap-1.5 shadow-2xs cursor-pointer whitespace-nowrap disabled:opacity-50\"\n            title=\"Download file PDF ke perangkat Anda\"\n          >\n            {isGeneratingPdf ? (\n              <Loader2 className=\"w-4 h-4 text-[#A3D9B1] animate-spin\" />\n            ) : (\n              <FileText className=\"w-4 h-4 text-[#A3D9B1]\" />\n            )}\n            <span>{isGeneratingPdf ? 'Memproses...' : 'Download PDF'}</span>\n          </button>\n          <button\n            id=\"btn-print-rekap\"\n            onClick={handlePrint}\n            className=\"text-xs font-semibold bg-white border border-[#E1DACB] text-[#22303F] px-3 py-2 rounded-lg hover:border-[#1F3D2E] transition flex items-center gap-1.5 shadow-2xs cursor-pointer whitespace-nowrap\"\n            title=\"Cetak Dokumen\"\n          >\n            <Printer className=\"w-3.5 h-3.5 text-[#5B6B7A]\" />\n            <span>Cetak</span>\n          </button>\n          <button\n            id=\"btn-export-csv\"\n "guru\">Absen Guru</option>\n              <option value=\"eskul\">Ekstrakurikuler</option>\n            </select>\n          </div>\n\n          {/* Eskul Selector & Sub-Tab (Only for Eskul) */}\n          {tipe === 'eskul' && (\n            <>\n              <div className=\"space-y-1\">\n                <label className=\"text-[10px] font-bold text-[#5B6B7A] uppercase tracking-wider block\">Pilih Kegiatan:</label>\n                <select\n                  id=\"select-rekap-eskul\"\n                  value={selectedEskulId}\n                  onChange={(e) => setSelectedEskulId(e.target.value)}\n                  className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2.5 py-2 text-xs font-bold text-[#22303F] focus:outline-none\"\n                >\n                  {eskulList.map(e => (\n                    <option key={e.id} value={e.id}>{e.nama}</option>\n                  ))}\n                </select>\n              </div>\n\n              <div className=\"space-y-1\">\n                <label className=\"text-[10px] font-bold text-[#5B6B7A] uppercase tracking-wider block\">Sub-Kategori Rekap:</label>\n                <select\n                  id=\"select-rekap-eskul-subtab\"\n                  value={eskulSubTab}\n                  onChange={(e) => setEskulSubTab(e.target.value as 'siswa' | 'guru')}\n                  className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2.5 py-2 text-xs font-bold text-[#22303F] focus:outline-none\"\n                >\n                  <option value=\"siswa\">Rekap Absensi Siswa Eskul</option>\n                  <option value=\"guru\">Rekap Kehadiran & Gaji Guru/Pembina</option>\n                </select>\n              </div>\n            </>\n          )}\n\n          {/* Kelas Selector (Only for Siswa) */}\n          {tipe === 'siswa' || (tipe === 'eskul' && eskulSubTab === 'siswa') ? (\n            <div className=\"space-y-1\">\n              <label className=\"text-[10px] font-bold text-[#5B6B7A] uppercase tracking-wider block\">Kelas:</label>\n              <select\n                id=\"select-rekap-kelas\"\n                value={selectedKelas}\n                onChange={(e) => setSelectedKelas(e.target.value)}\n                className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2.5 py-2 text-xs font-bold text-[#22303F] focus:outline-none\"\n              >\n                <option value=\"semua\">Semua Kelas</option>\n                {roster.classes.map(k => (\n                  <option key={k} value={k}>Kelas {k}</option>\n                ))}\n              </select>\n            </div>\n          ) : null}\n\n          {/* Date Range Picker */}\n          <div className=\"space-y-1\">\n            <label className=\"text-[10px] font-bold text-[#5B6B7A] uppercase tracking-wider block\">Dari Tanggal:</label>\n            <input\n              type=\"date\"\n              id=\"input-rekap-start\"\n              value={startDate}\n              onChange={(e) => setStartDate(e.target.value)}\n              className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2 py-2 text-xs font-semibold text-[#22303F] focus:outline-none\"\n            />\n          </div>\n\n          <div className=\"space-y-1\">\n            <label className=\"text-[10px] font-bold text-[#5B6B7A] uppercase tracking-wider block\">Sampai Tanggal:</label>\n            <input\n              type=\"date\"\n              id=\"input-rekap-end\"\n              value={endDate}\n              onChange={(e) => setEndDate(e.target.value)}\n              className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2 py-2 text-xs font-semibold text-[#22303F] focus:outline-none\"\n            />\n          </div>\n        </div>\n      </div>\n\n      {/* Aggregate Totals Summary */}\n      <div className=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n        <div className=\"bg-[#E4F3EA] border border-[#1F7A4C]/30 rounded-xl p-3 shadow-[inset_0_1px_1px_rgba(255,255,255,0.  }\n\n    const result = resetAttendanceForRange(types, startDateStr, endDateStr);\n\n    const categoriesText: string[] = [];\n    if (targetSiswa) categoriesText.push('Siswa');\n    if (targetGuru) categoriesText.push('Guru');\n    if (targetEskul) categoriesText.push('Ekstrakurikuler');\n\n    onShowToast(`Berhasil mereset presensi ${categoriesText.join(', ')} untuk ${result.countDates} hari!`);\n\n    if (onAttendanceReset) {\n      onAttendanceReset(startDateStr, endDateStr);\n    }\n\n    setShowConfirm(false);\n    onClose();\n  };\n\n  const monthNames = [\n    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',\n    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'\n  ];\n\n  return (\n    <div className=\"fixed inset-0 bg-black/60 backdrop-blur-xs z-[70] flex items-center justify-center p-0 sm:p-4 animate-in fade-in duration-150\">\n      <div className=\"bg-white w-full h-full sm:h-[92vh] sm:max-w-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden\">\n        {/* Header Modal Full Screen */}\n        <div className=\"bg-[#1F3D2E] text-white p-4 sm:p-5 flex items-center justify-between shrink-0 shadow-sm\">\n          <div className=\"flex items-center gap-3\">\n            <div className=\"w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-lg\">\n              <RotateCcw className=\"w-5 h-5 text-amber-300\" />\n            </div>\n            <div>\n              <h3 className=\"font-kalam font-bold text-base sm:text-lg text-white leading-snug\">\n                Reset Presensi (Absensi Only) 🔄\n              </h3>\n              <p className=\"text-xs text-[#CFE3D6] mt-0.5\">\n                Pilih periode dan kategori yang ingin dibersihkan tanpa menghapus data siswa/guru.\n              </p>\n            </div>\n          </div>\n\n          <button\n            type=\"button\"\n            onClick={onClose}\n            className=\"w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white opacity-80 font-normal\">(Rentang Tgl)</span>\n              </button>\n            </div>\n          </div>\n\n          {/* DYNAMIC DATE CONTROLS ACCORDING TO SCOPE */}\n          <div className=\"bg-[#FAF8F5] p-3 rounded-xl border border-[#EDE8DC] space-y-2\">\n            {scope === 'harian' && (\n              <div className=\"space-y-1\">\n                <span className=\"font-bold text-[#22303F] text-xs\">Pilih Tanggal Spesifik yang Ingin Di-reset:</span>\n                <div className=\"flex flex-col sm:flex-row items-start sm:items-center gap-2 pt-1\">\n                  <input\n                    type=\"date\"\n                    value={harianDate}\n                    onChange={(e) => setHarianDate(e.target.value)}\n                    className=\"bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E] shadow-2xs\"\n                  />\n                  <span className=\"text-xs text-[#1F7A4C] font-semibold\">\n                    Target: {formatIndonesianDate(harianDate)}\n                  </span>\n                </div>\n              </div>\n            )}\n\n            {scope === 'mingguan' && (\n              <div className=\"space-y-1\">\n                <span className=\"font-bold text-[#22303F] text-xs\">Pilih Salah Satu Tanggal dalam Minggu Target:</span>\n                <div className=\"flex flex-col sm:flex-row items-start sm:items-center gap-2 pt-1\">\n                  <input\n                    type=\"date\"\n                    value={mingguanRefDate}\n                    onChange={(e) => setMingguanRefDate(e.target.value)}\n                    className=\"bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E] shadow-2xs\"\n                  />\n                  <div className=\"text-xs text-[#22303F] font-semibold bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg\">\n                    📅 Minggu Ini: <span className=\"font-bold text-[#B5730E]\">{formatIndonesianDate(startDateStr)}</span> s/d <span className=\"font-bold text-[#B5730E]\">{formatIndonesianDate(endDateStr)}</span>\n                  </div>\n                </div>\n              </div>\n            )}\n\n            {scope === 'bulanan' && (\n              <div className=\"space-y-2\">\n                <span className=\"font-bold text-[#22303F] text-xs\">Pilih Bulan & Tahun Target:</span>\n                <div className=\"grid grid-cols-2 gap-2\">\n                  <div>\n                    <label className=\"text-[10px] font-bold text-[#5B6B7A] block mb-0.5\">Bulan:</label>\n                    <select\n                      value={bulananMonth}\n                      onChange={(e) => setBulananMonth(Number(e.target.value))}\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    >\n                      {monthNames.map((mName, idx) => (\n                        <option key={idx + 1} value={idx + 1}>\n                          {idx + 1}. {mName}\n                        </option>\n                      ))}\n                    </select>\n                  </div>\n                  <div>\n                    <label className=\"text-[10px] font-bold text-[#5B6B7A] block mb-0.5\">Tahun:</label>\n                    <select\n                      value={bulananYear}\n                      onChange={(e) => setBulananYear(Number(e.target.value))}\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    >\n                      {[2024, 2025, 2026, 2027, 2028, 2029, 2030].map(y => (\n                        <option key={y} value={y}>{y}</option>\n                      ))}\n                    </select>\n                  </div>\n                </div>\n                <p className=\"text-[11px] text-[#1F7A4C] font-semibold pt-1\">\n                  🗓️ Seluruh presensi bulan {monthNames[bulananMonth - 1]} {bulananYear} akan di-reset ({formatIndonesianDate(startDateStr)} s/d {formatIndonesianDate(endDateStr)}).\n                </p>\n              </div>\n            )}\n\n            {scope === 'custom' && (\n              <div className=\"space-y-2\">\n                <span className=\"font-bold text-[#22303F] text-xs\">Tentukan Periode Awal & Akhir:</span>\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-2\">\n                  <div>\n                    <label className=\"text-[10px] font-bold text-[#5B6B7A] block mb-0.5\">Dari Tanggal:</label>\n                    <input\n                      type=\"date\"\n                      value={customStartDate}\n                      onChange={(e) => setCustomStartDate(e.target.value)}\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none\"\n                    />\n                  </div>\n                  <div>\n                    <label className=\"text-[10px] font-bold text-[#5B6B7A] block mb-0.5\">Sampai Tanggal:</label>\n                    <input\n                      type=\"date\"\n                      value={customEndDate}\n                      onChange={(e) => setCustomEndDate(e.target.value)}\n                      className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-3 py-1.5 text-xs font-bold text-[#22303F] focus:outline-none\"\n                    />\n                  </div>\n                </div>\n              </div>\n            )}\n          </div>\n\n          {/* 2. TARGET PRESENCY CATEGORY CHECKBOXES */}\n          <div className=\"space-y-2\">\n            <div className=\"flex items-center justify-between\">\n              <label className=\"font-bold text-[#22303F] text-xs flex items-center gap-1.5\">\n                <Filter className=\"w-4 h-4 text-[#1F3D2E]\" />\n                <span>2. Pilih Kategori Presensi yang Di-reset:</span>\n              </label>\n\n              <div className=\"flex gap-2\">\n                <button\n                  type=\"button\"\n                  onClick={() => handleToggleAllCategories(true)}\n                  className=\"text-[10px] font-bold text-[#1F7A4C] hover:underline cursor-pointer\"\n                >\n                  Pilih Semua\n                </button>\n                <span className=\"text-[#8C9BA5]\">|</span>\n                <button\n                  type=\"button\"\n                  onClick={() => handleToggleAllCategories(false)}\n                  className=\"text-[10px] font-bold text-[#5B6B7A] hover:underline cursor-pointer\"\n                >\n                  Kosongkan\n                </button>\n              </div>\n            </div>\n\n            <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-2\">\n              {/* Siswa */}\n              <label className={`p-2.5 rounded-xl border transition cursor-pointer flex items-center gap-2.5 ${\n                targetSiswa ? 'bg-[#E4F3EA] border-[#1F7A4C] text-[#1F3D2E]' : 'bg-[#FAF8F5] border-[#EDE8DC] text-[#5B6B7A]'\n              }`}>\n                <input\n                  type=\"checkbox\"\n                  checked={targetSiswa}\n                  onChange={(e) => setTargetSiswa(e.target.checked)}\n                  className=\"w-4 h-4 accent-[#1F7A4C] rounded cursor-pointer\"\n                />\n                <div>\n                  <span className=\"font-bold block text-xs\">🧑‍🎓 Presensi Siswa</span>\n                  <span className=\"text-[9px] opacity-80 block font-normal\">Absen Harian Seluruh Kelas</span>\n                </div>\n              </label>\n\n              {/* Guru */}\n              <label className={`p-2.5 rounded-xl border transition cursor-pointer flex items-center gap-2.5 ${\n                targetGuru ? 'bg-[#EBF3FB] border-[#2B6CB0] text-[#1A365D]' : 'bg-[#FAF8F5] border-[#EDE8DC] text-[#5B6B7A]'\n              }`}>\n                <input\n                  type=\"checkbox\"\n                  checked={targetGuru}\n                  onChange={(e) => setTargetGuru(e.target.checked)}\n                  className=\"w-4 h-4 accent-[#2B6CB0] rounded cursor-pointer\"\n                />\n                <div>\n                  <span className=\"font-bold block text-xs\">👨‍🏫 Presensi Guru</span>\n                  <span className=\"text-[9px] opacity-80 block font-normal\">Kehadiran & Honor Harian</span>\n                </div>\n              </label>\n\n              {/* Eskul */}\n              <label className={`p-2.5 rounded-xl border transition cursor-pointer flex items-center gap-2.5 ${\n                targetEskul ? 'bg-[#FFF4E5] border-[#B5730E] text-[#633D00]' : 'bg-[#FAF8F5] border-[#EDE8DC] text-[#5B6B7A]'\n              }`}>\n                <input\n                  type=\"checkbox\"\n                  checked={targetEskul}\n                  onChange={(e) => setTargetEskul(e.target.checked)}\n                  className=\"w-4 h-4 accent-[#B5730E] rounded cursor-pointer\"\n                />\n                <div>\n                  <span className=\"font-bold block text-xs\">🏆 Presensi Eskul</span>\n                  <span className=\"text-[9px] opacity-80 block font-normal\">Sesi Ekstrakurikuler</span>\n                </div>\n              </label>\n            </div>\n          </div>\n\n          {/* SUMMARY BOX BEFORE CONFIRMATION */}\n          <div className=\"bg-[#FFFDF9] border border-amber-300/80 p-3 rounded-xl space-y-1\">\n            <div className=\"flex items-center gap-1.5 text-amber-900 font-bold text-xs\">\n              <Sparkles className=\"w-4 h-4 text-amber-600\" />\n              <span>Ringkasan Tindakan Reset:</span>\n            </div>\n            <p className=\"text-[11px] text-[#22303F] leading-snug\">\n              Akan membersihkan data presensi <span className=\"font-bold text-[#1F7A4C]\">{[\n                targetSiswa && 'Siswa',\n                targetGuru && 'Guru',\n                targetEskul && 'Eskul'\n              ].filter(Boolean).join(', ') || 'Belum dipilih'}</span> pada <span className=\"font-bold text-[#B5730E]\">{summaryLabel}</span>.\n            </p>\n          </div>\n\n          {/* WARNING PROMPT IF CONFIRM STEP CLICKED */}\n          {showConfirm && (\n            <div className=\"bg-[#FDF2F2] border-2 border-[#C23B3B]/40 p-3.5 rounded-xl space-y-2 animate-fadeIn\">\n              <div className=\"flex items-center gap-2 text-[#C23B3B] font-extrabold text-xs\">\n                <AlertTriangle className=\"w-4 h-4 shrink-0\" />\n                <span>Konfirmasi Akhir Reset Presensi</span>\n              </div>\n              <p className=\"text-xs text-[#22303F] leading-snug\">\n                Apakah Anda benar-benar yakin ingin mereset data presensi ini? Tindakan ini tidak dapat dibatalkan, namun data nama/profil siswa dan guru Anda dipastikan aman.\n              </p>\n              <div className=\"flex items-center justify-end gap-2 pt-1\">\n                <button\n                  type=\"button\"\n                  onClick={() => setShowConfirm(false)}\n                  className=\"bg-[#E1DACB] text-[#5B6B7A] font-bold text-xs px-3 py-1.5 rounded-lg hover:bg-[#d5cebe] cursor-pointer\"\n                >\n                  Batal\n                </button>\n                <button\n                  type=\"button\"\n                  onClick={handleExecuteReset}\n                  className=\"bg-[#C23B3B] hover:bg-[#a83232] text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow-md transition cursor-pointer flex items-center gap-1\"\n                >\n                  <RotateCcw className=\"w-3.5 h-3.5\" />\n                  <span>Ya, Reset Presensi Sekarang</span>\n                </button>\n              </div>\n            </div>\n          )}\n        </div>\n\n        {/* Footer Actions */}\n        <div className=\"p-3 sm:p-4 bg-[#FAF8F5] border-t border-[#EDE8DC] flex items-center justify-between shrink-0\">\n          <button\n            type=\"button\"\n            onClick={onClose}\n            className=\"bg-[#5B6B7A] hover:bg-[#4A5764] text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl transition shadow-xs cursor-pointer\"\n          >\n            Tutup\n          </button>\n\n          {!showConfirm && (\n            <button\n              type=\"button\"\n              onClick={() => {\n                if (!targetSiswa && !targetGuru && !targetEskul) {\n                  onShowToast('Pilih minimal satu kategori presensi!');\n                  return;\n                }\n                setShowConfirm(true);\n              }}\n              className=\"bg-[#1F3D2E] hover:bg-[#163022] text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl shadow-xs transition flex items-center gap-2 cursor-pointer active:scale-95\"\n            >\n              <RotateCcw className=\"w-4 h-4 text-amber-300\" />\n              <span>Reset Presensi Periode Ini</span>\n            </button>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/components/ViewKelolaData.tsx =====\n\n\n\n\n\n\n\n\nconst PRESET_STEMPEL_MERAH = `data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"54\" fill=\"none\" stroke=\"%23c23b3b\" stroke-width=\"4\" stroke-dasharray=\"80 2\"/><circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"%23c23b3b\" stroke-width=\"2\"/><path id=\"textPathTop\" fill=\"none\" d=\"M 20,60 A 40,40 0 0,1 100,60\" /><text fill=\"%23c23b3b\" font-size=\"9\" font-family=\"sans-serif\" font-weight=\"bold\" letter-spacing=\"1.5\"><textPath href=\"%23textPathTop\" startOffset=\"50%\" text-anchor=\"middle\">STEMPEL RESMI MADRASAH</textPath></text><line x1=\"25\" y1=\"60\" x2=\"95\" y2=\"60\" stroke=\"%23c23b3b\" stroke-width=\"2\"/><text x=\"60\" y=\"54\" fill=\"%23c23b3b\" font-size=\"11\" font-family=\"sans-serif\" font-weight=\"900\" text-anchor=\"middle\">TERVERIFIKASI</text><text x=\"60\" y=\"72\" fill=\"%23c23b3b\" font-size=\"10\" font-family=\"sans-serif\" font-weight=\"800\" text-anchor=\"middle\">SAH %26 RESMI</text></svg>`;\n\nconst PRESET_STEMPEL_BIRU = `data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"54\" fill=\"none\" stroke=\"%232b6cb0\" stroke-width=\"4\"/><circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"%232b6cb0\" stroke-width=\"2\"/><text x=\"60\" y=\"52\" fill=\"%232b6cb0\" font-size=\"11\" font-family=\"sans-serif\" font-weight=\"900\" text-anchor=\"middle\">STEMPEL RESMI</text><text x=\"60\" y=\"70\" fill=\"%232b6cb0\" font-size=\"10\" font-family=\"sans-serif\" font-weight=\"800\" text-anchor=\"middle\">TERDAFTAR LEGAL</text></svg>`;\n\ninterface ViewKelolaDataProps {\n  sekolahInfo: SekolahInfo;\n  onSaveSekolahInfo: (info: SekolahInfo) => void;\n  roster: Roster;\n  onSaveRoster: (roster: Roster) => void;\n  onResetDemoData: () => void;\n  onClearAllData: () => void;\n  onShowToast: (msg: string) => void;\n  todayDateStr?: string;\n  initialTab?: 'rekap' | 'master';\n  onAttendanceReset?: (startDate: string, endDate: string) => void;\n}\n\ninterface TeacherItemRowProps {\n  g: Person;\n  onOpenEditModal: (g: Person) => void;\n  onDeleteGuru: (id: string, nama: string) => void;\n  onUpdateTeacherPhoto: (id: string, photoBase64: string) => void;\n  allEskuls: EskulItem[];\n}\n\nconst TeacherItemRow: React.FC<TeacherItemRowProps> = ({\n  g,\n  onOpenEditModal,\n  onDeleteGuru,\n  onUpdateTeacherPhoto,\n  allEskuls\n}) => {\n  const fileInputTeacherPhotoRef = useRef<HTMLInputElement>(null);\n\n  const handleTeacherPhotoChange = async (e: React.ChangeEvent<HTMLInputElement>) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n    try {\n      const compressedBase64 = await compressImageFile(file, 320, 420, 0.75);\n      onUpdateTeacherPhoto(g.id, compressedBase64);\n    } catch {\n      alert('Gagal memproses foto guru');\n    }\n    if (e.target) e.target.value = '';\n  };\n\n  const teacherEskuls = g.eskulIds || [];\n  const assignedEskulObjects = allEskuls.filter(e => teacherEskuls.includes(e.id));\n\n  return (\n    <div className=\"bg-white border-2 border-[#EDE8DC] hover:border-[#1F3D2E]/40 rounded-xl p-3 space-y-2 text-xs shadow-2xs transition-all\">\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2\">\n        <div className=\"flex items-center gap-2.5 min-w-0\">\n          {/* Avatar / Pas Foto Thumbnail */}\n          <div className=\"w-9 h-11 rounded-lg border border-[#EDE8DC] bg-[#FAF8F5] overflow-hidden shrink-0 flex items-center justify-center relative shadow-2xs\">\n            {g.fotoUrl ? (\n              <img src={g.fotoUrl} alt={g.nama} className=\"w-full h-full object-cover\" />\n            ) : (\n              <UserCheck className=\"w-4 h-4 text-[#1F7A4C]\" />\n            )}\n          </div>\n          <div className=\"min-w-0\">\n            <span className=\"font-bold text-[#22303F] text-xs sm:text-sm block truncate\">{g.nama}</span>\n            <div className=\"text-[11px] text-[#5B6B7A] flex flex-wrap items-center gap-1.5 font-jetbrains\">\n              {g.nisNip && <span>{g.nisNip}</span>}\n              {g.nisNip && g.mataPelajaran && <span>•</span>}\n              <span className=\"font-semibold text-[#1F3D2E]\">{g.mataPelajaran || 'Guru'}</span>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"flex items-center justify-end gap-1.5 shrink-0 pt-1 sm:pt-0 border-t sm:border-t-0 border-[#F4F1E9]\">\n          <input\n            type=\"file\"\n            ref={fileInputTeacherPhotoRef}\n            accept=\"image/*\"\n            onChange={handleTeacherPhotoChange}\n            className=\"hidden\"\n          />\n          <button\n            type=\"button\"\n            onClick={() => fileInputTeacherPhotoRef.current?.click()}\n            className=\"text-[11px] text-[#1F7A4C] bg-[#E4F3EA] hover:bg-[#d6eedf] px-2.5 py-1.5 rounded-lg border border-[#1F7A4C]/30 transition font-bold flex items-center gap-1 cursor-pointer touch-manipulation\"\n            title=\"Upload / Ubah Pas Foto 3x4 Guru\"\n          >\n            <ImageIcon className=\"w-3.5 h-3.5\" />\n            <span>{g.fotoUrl ? 'Foto' : '+ Foto'}</span>\n          </button>\n\n          <button\n            type=\"button\"\n            onClick={() => onOpenEditModal(g)}\n            className=\"px-2.5 py-1.5 rounded-lg border transition touch-manipulation text-[11px] font-bold flex items-center gap-1 cursor-pointer bg-[#FAF8F5] text-[#22303F] border-[#E1DACB] hover:bg-[#1F3D2E] hover:text-white hover:border-[#1F3D2E]\"\n            title=\"Edit Data Guru\"\n          >\n            <Edit3 className=\"w-3.5 h-3.5\" />\n            <span>Edit Data</span>\n          </button>\n          <button\n            type=\"button\"\n            onClick={() => onDeleteGuru(g.id, g.nama)}\n            className=\"text-xs text-[#C23B3B] bg-[#FDF2F2] hover:bg-[#FEE2E2] border border-[#F87171]/30 p-1.5 rounded-lg transition cursor-pointer touch-manipulation\"\n            title=\"Hapus Guru\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5\" />\n          </button>\n        </div>\n      </div>\n\n      {/* Summary row - Only show Eskul Pembina if present */}\n      {assignedEskulObjects.length > 0 && (\n        <div className=\"flex flex-wrap items-center gap-1 text-[11px] text-[#5B6B7A] pt-1 border-t border-[#F4F1E9]\">\n          <span className=\"text-[10px] font-bold text-[#B5730E]\">Pembina:</span>\n          {assignedEskulObjects.map(esk => (\n            <span key={esk.id} className=\"bg-[#FFF4E5] text-[#B5730E] border border-[#F6AD55]/40 font-bold px-1.5 py-0.2 rounded text-[10px]\">\n              🏆 {esk.nama}\n            </span>\n          ))}\n        </div>\n      )}\n    </div>\n  );\n};\n\nconst ViewKelolaData: React.FC<ViewKelolaDataProps> = ({\n  sekolahInfo,\n  onSaveSekolahInfo,\n  roster,\n  onSaveRoster,\n  onResetDemoData,\n  onClearAllData,\n  onShowToast,\n  todayDateStr = '',\n  initialTab = 'master',\n  onAttendanceReset\n}) => {\n  const [subTab, setSubTab] = useState<'rekap' | 'master'>(initialTab);\n  const [showResetAttendanceModal, setShowResetAttendanceModal] = useState<boolean>(false);\n\n  React.useEffect(() => {\n    setSubTab(initialTab);\n  }, [initialTab]);\n\n  // Modal State: 'sekolah' | 'kelas' | 'siswa' | 'guru' | 'eskul' | 'reset' | null\n  const [activeModal, setActiveModal] = useState<'sekolah' | 'kelas' | 'siswa' | 'guru' | 'eskul' | 'reset' | null>(null);\n\n  // School Info State\n  const [namaSekolahInput, setNamaSekolahInput] = useState<string>(sekolahInfo.nama || '');\n  const [kepalaSekolahInput, setKepalaSekolahInput] = useState<string>(sekolahInfo.kepalaSekolah || '');\n  const [nipKepalaSekolahInput, setNipKepalaSekolahInput] = useState<string>(sekolahInfo.nipKepalaSekolah || '');\n  const [npsnInput, setNpsnInput] = useState<string>(sekolahInfo.npsn || '20253812');\n  const [stempelUrlInput, setStempelUrlInput] = useState<string>(sekolahInfo.stempelUrl || '');\n  const [logoUrlInput, setLogoUrlInput] = useState<string>(sekolahInfo.logoUrl || '');\n\n  const fileInputStempelRef = useRef<HTMLInputElement>(null);\n  const fileInputLogoRef = useRef<HTMLInputElement>(null);\n\n  // Student Pas Foto Upload State\n  const [targetStudentForPhoto, setTargetStudentForPhoto] = useState<string | null>(null);\n  const fileInputStudentPhotoRef = useRef<HTMLInputElement>(null);\n\n  const handleTriggerStudentPhoto = (studentId: string) => {\n    setTargetStudentForPhoto(studentId);\n    fileInputStudentPhotoRef.current?.cli "w-4 h-4\" />\n                      <span>Hapus Semua Data Guru ({roster.teachers.length} Guru)</span>\n                    </button>\n                  </div>\n                )}\n\n                {formatTargetCategory === 'full' && (\n                  <div className=\"bg-white p-3.5 rounded-xl border border-red-200 space-y-3 animate-in fade-in duration-150\">\n                    <div className=\"bg-red-50 p-2.5 rounded-lg border border-red-200\">\n                      <h5 className=\"text-xs font-bold text-[#C23B3B] flex items-center gap-1.5\">\n                        <span>⚠️ PERINGATAN CRITICAL (FULL FORMAT)</span>\n                      </h5>\n                      <p className=\"text-[11px] text-red-700 mt-0.5 leading-snug\">\n                        Tindakan ini akan <strong>MENGHAPUS TOTAL</strong> seluruh data master: {roster.students.length} siswa, {roster.teachers.length} guru, {roster.classes.length} kelas, dan seluruh riwayat presensi.\n                      </p>\n                    </div>\n\n                    <button\n                      type=\"button\"\n                      onClick={() => {\n                        if (confirm('⚠️ PERINGATAN FULL FORMAT KELOLA DATA:\\n\\nApakah Anda yakin ingin MENGHAPUS TOTAL seluruh data siswa, guru, kelas, dan riwayat presensi?\\n\\nSemua data master akan dikosongkan agar Anda dapat memulai dari nol.')) {\n                          onClearAllData();\n                          onShowToast('Sistem berhasil di-Full Format (semua data dikosongkan)');\n                          setActiveModal(null);\n                        }\n                      }}\n                      className=\"w-full bg-[#8B0000] hover:bg-[#660000] text-white font-bold text-xs sm:text-sm py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 shadow-xs cursor-pointer touch-manipulation\"\n                    >\n                      <Trash2 className=\"w-4 h-4\" />\n                      <span>Full Format System (Kosongkan Semua Master Data)</span>\n                    </button>\n                  </div>\n                )}\n              </div>\n\n              {/* Option 3: Restore Data Contoh */}\n              <div className=\"bg-[#FAF8F5] border border-[#E1DACB] rounded-xl p-3.5 sm:p-4 space-y-2.5 hover:bg-white transition\">\n                <div className=\"flex items-start justify-between gap-2\">\n                  <div className=\"flex items-center gap-2.5\">\n                    <div className=\"w-10 h-10 rounded-xl bg-[#5B6B7A] text-white flex items-center justify-center font-bold text-lg shrink-0 shadow-xs\">\n                      🔄\n                    </div>\n                    <div>\n                      <h4 className=\"font-bold text-xs sm:text-sm text-[#22303F]\">3. Reset & Restore ke Data Contoh (Demo Roster)</h4>\n                      <p className=\"text-[11px] sm:text-xs text-[#5B6B7A]\">\n                        Kembalikan daftar kelas, 15 Dewan Guru MTs Anwarul Hidayah, dan Ekstrakurikuler ke data awal.\n                      </p>\n                    </div>\n                  </div>\n                </div>\n                <button\n                  type=\"button\"\n                  onClick={() => {\n                    if (confirm('Kembalikan data ke contoh awal (demo data)? Data custom saat ini akan diganti dengan data contoh.')) {\n                      onResetDemoData();\n                      setActiveModal(null);\n                    }\n                  }}\n                  className=\"w-full bg-[#F4F1E9] hover:bg-[#E1DACB] text-[#22303F] border border-[#E1DACB] font-bold text-xs sm:text-sm py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer touch-manipulation\"\n                >\n                  <RotateCcw className=\"w-4 h-4\" />\n                  <span>Restore ke Data Contoh (Default MTs Anwarul Hidayah)</span>\n                </button>\n              </div>\n\n              {/* Option 4: Reset Profil Sekolah */}\n              <div className=\"bg-[#EBF3FB]/70 border border-[#BEE3F8] rounded-xl p-3.5 sm:p-4 space-y-2.5 hover:bg-[#EBF3FB] transition\">\n                <div className=\"flex items-start justify-between gap-2\">\n                  <div className=\"flex items-center gap-2.5\">\n                    <div className=\"w-10 h-10 rounded-xl bg-[#2B6CB0] text-white flex items-center justify-center font-bold text-lg shrink-0 shadow-xs\">\n                      🏫\n                    </div>\n                    <div>\n                      <h4 className=\"font-bold text-xs sm:text-sm text-[#2B6CB0]\">4. Reset Profil & Stempel Resmi Sekolah</h4>\n                      <p className=\"text-[11px] sm:text-xs text-[#5B6B7A]\">\n                        Reset nama instansi, nama kepala sekolah, NIP, serta logo & gambar stempel resmi kembali ke standar.\n                      </p>\n                    </div>\n                  </div>\n                </div>\n                <button\n                  type=\"button\"\n                  onClick={() => {\n                    if (confirm('Reset profil sekolah dan stempel resmi kembali ke standar?')) {\n                      const defaultInfo = {\n                        nama: DEFAULT_SEKOLAH_INFO.nama || 'MTs Anwarul Hidayah Babakankeusik',\n                        kepalaSekolah: DEFAULT_SEKOLAH_INFO.kepalaSekolah || 'AHIM, Spd.I',\n                        nipKepalaSekolah: DEFAULT_SEKOLAH_INFO.nipKepalaSekolah || '198201012005011002',\n                        stempelUrl: '',\n                        logoUrl: ''\n                      };\n                      setNamaSekolahInput(defaultInfo.nama);\n                      setKepalaSekolahInput(defaultInfo.kepalaSekolah);\n                      setNipKepalaSekolahInput(defaultInfo.nipKepalaSekolah);\n                      setStempelUrlInput('');\n                      setLogoUrlInput('');\n                      onSaveSekolahInfo(defaultInfo);\n                      onShowToast('Profil sekolah & stempel resmi berhasil di-reset ke standar');\n                      setActiveModal(null);\n                    }\n                  }}\n                  className=\"w-full bg-[#2B6CB0] hover:bg-[#235891] text-white font-bold text-xs sm:text-sm py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 shadow-xs cursor-pointer touch-manipulation\"\n                >\n                  <School className=\"w-4 h-4\" />\n                  <span>Reset Profil & Stempel Sekolah</span>\n                </button>\n              </div>\n            </div>\n\n            <div className=\"p-3 sm:p-4 bg-[#FAF8F5] border-t border-[#EDE8DC] flex justify-end shrink-0\">\n              <button\n                type=\"button\"\n                onClick={() => setActiveModal(null)}\n                className=\"bg-[#5B6B7A] hover:bg-[#4A5764] text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl transition shadow-xs cursor-pointer\"\n              >\n                Tutup\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* 1. POPUP PROFIL & STEMPEL RESMI SEKOLAH */}\n      {activeModal === 'sekolah' && (\n        <div className=\"fixed inset-0 bg-black/60 backdrop-blur-xs z-[60] flex items-center justify-center p-0 sm:p-4 animate-in fade-in duration-150\">\n          <div className=\"bg-white w-full h-full sm:h-[92vh] sm:max-w-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden\">\n            {/* Header Modal Full Screen */}\n            <div className=\"bg-[#1F3D2E] text-white p-4 sm:p-5 flex items-center justify-between shrink-0 shadow-sm\">\n              <div className=\"flex items-center gap-3\">\n                <div className=\"w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-lg\">\n                  <BadgeCheck className=\"w-5 h-5 text-[#A3D9B1]\" />\n                </div>\n                <div>\n                  <h3 className=\"font-kalam font-bold text-base sm:text-lg text-white\">\n                    Kelola Profil & Stempel Resmi Sekolah\n                  </h3>\n                  <p className=\"text-xs text-[#CFE3D6] mt-0.5\">\n                    Foto stempel resmi ini akan otomatis dicetak pada Kartu Presensi & Kartu OSIS.\n                  </p>\n                </div>\n              </div>\n              <button\n                type=\"button\"\n                onClick={() => setActiveModal(null)}\n                className=\"w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer shrink-0\"\n                title=\"Tutup Modal\"\n              >\n                <X className=\"w-5 h-5\" />\n              </button>\n            </div>\n\n            <form onSubmit={handleSaveSekolah} className=\"flex-1 flex flex-col overflow-hidden\">\n              <div className=\"p-4 sm:p-6 space-y-5 overflow-y-auto flex-1\">\n                {/* Nama Sekolah & NPSN */}\n                <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-4\">\n                  <div className=\"sm:col-span-2\">\n                    <label className=\"text-xs sm:text-sm font-bold text-[#22303F] block mb-1.5\">\n                      Nama Resmi Sekolah / Madrasah / Instansi: <span className=\"text-red-500\">*</span>\n                    </label>\n                    <input\n                      type=\"text\"\n                      required\n                      value={namaSekolahInput}\n                      onChange={(e) => setNamaSekolahInput(e.target.value)}\n                      placeholder=\"Contoh: MTs Anwarul Hidayah Babakankeusik\"\n                      className=\"w-full bg-[#FEFDFB] border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    />\n                  </div>\n                  <div>\n                    <label className=\"text-xs sm:text-sm font-bold text-[#22303F] block mb-1.5\">\n                      NPSN Sekolah / Instansi:\n                    </label>\n                    <input\n                      type=\"text\"\n                      value={npsnInput}\n                      onChange={(e) => setNpsnInput(e.target.value)}\n                      placeholder=\"Contoh: 20253812\"\n                      className=\"w-full bg-[#FEFDFB] border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    />\n                  </div>\n                </div>\n\n                {/* Kepala Sekolah & NIP */}\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                  <div>\n                    <label className=\"text-xs sm:text-sm font-bold text-[#22303F] block mb-1.5\">\n                      Nama Kepala Sekolah / Pembina:\n                    </label>\n                    <input\n                      type=\"text\"\n                      value={kepalaSekolahInput}\n                      onChange={(e) => setKepalaSekolahInput(e.target.value)}\n                      placeholder=\"Contoh: AHIM, Spd.I\"\n                      className=\"w-full bg-[#FEFDFB] border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    />\n                  </div>\n                  <div>\n                    <label className=\"text-xs sm:text-sm font-bold text-[#22303F] block mb-1.5\">\n                      NIP / NIK Kepala Sekolah:\n                    </label>\n                    <input\n                      type=\"text\"\n                      value={nipKepalaSekolahInput}\n                      onChange={(e) => setNipKepalaSekolahInput(e.target.value)}\n                      placeholder=\"Contoh: NIP. 19820101...\"\n                      className=\"w-full bg-[#FEFDFB] border border-[#E1DACB] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                    />\n                  </div>\n                </div>\n\n                {/* STEMPEL RESMI SECTION */}\n                <div className=\"bg-[#FAF8F5] border-2 border-[#EDE8DC] p-4 rounded-2xl space-y-3.5\">\n                  <div className=\"flex items-center justify-between\">\n                    <div className=\"flex items-center gap-2\">\n                      <BadgeCheck className=\"w-5 h-5 text-[#1F7A4C]\" />\n                      <span className=\"text-xs sm:text-sm font-bold text-[#22303F]\">Foto Stempel Resmi Sekolah (Untuk Cetak Kartu)</span>\n                    </div>\n                    {stempelUrlInput && (\n                      <span className=\"text-[11px] bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full border border-emerald-300\">\n                        Stempel Terpasang\n                      </span>\n                    )}\n                  </div>\n\n                  <div className=\"flex flex-col sm:flex-row items-center gap-4 bg-white p-3.5 rounded-xl border border-[#EDE8DC]\">\n                    {/* Stempel Preview Box */}\n                    <div className=\"w-24 h-24 rounded-xl border-2 border-dashed border-[#1F3D2E]/30 bg-[#FAF8F5] flex items-center justify-center p-1 shrink-0 relative overflow-hidden shadow-xs\">\n                      {stempelUrlInput ? (\n                        <img\n                          src={stempelUrlInput}\n                          alt=\"Stempel Resmi\"\n                          className=\"w-full h-full object-contain mix-blend-multiply filter drop-shadow-xs\"\n                        />\n                      ) : (\n                        <div className=\"text-center p-1\">\n                          <ImageIcon className=\"w-7 h-7 text-[#8C9BA5] mx-auto mb-1\" />\n                          <span className=\"text-[9px] text-[#8C9BA5] font-bold block\">Belum Ada Stempel</span>\n                        </div>\n                      )}\n                    </div>\n\n                    <div className=\"flex-1 space-y-2.5 text-center sm:text-left\">\n                      <p className=\"text-xs text-[#5B6B7A] leading-relaxed\">\n                        Upload foto stempel resmi (PNG disarankan/JPG). Stempel akan otomatis dipasang di tanda tangan kartu yang dicetak.\n                      </p>\n\n                      <input\n                        type=\"file\"\n                        ref={fileInputStempelRef}\n                        accept=\"image/*\"\n                        onChange={handleUploadStempelFile}\n                        className=\"hidden\"\n                      />\n\n                      <div className=\"flex flex-wrap items-center gap-2 justify-center sm:justify-start\">\n                        <button\n                          type=\"button\"\n                          onClick={() => fileInputStempelRef.current?.click()}\n                          className=\"bg-[#1F7A4C] hover:bg-[#18623d] text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer shadow-2xs\"\n                        >\n                          <Upload className=\"w-4 h-4\" />\n                          <span>Upload Foto Stempel</span>\n                        </button>\n\n                        <button\n                          type=\"button\"\n                          onClick={() => {\n                            setStempelUrlInput(PRESET_STEMPEL_MERAH);\n                            onShowToast('Memakai Stempel Merah Resmi!');\n                          }}\n                          className=\"bg-[#FFF2F2] hover:bg-[#FEE2E2] text-[#C23B3B] border border-[#C23B3B]/30 font-bold text-xs px-3 py-2 rounded-xl transition cursor-pointer\"\n                          title=\"Pakai contoh stempel lingkaran merah resmi\"\n                        >\n                          🔴 Contoh Merah\n                        </button>\n\n                        <button\n                          type=\"button\"\n                          onClick={() => {\n                            setStempelUrlInput(PRESET_STEMPEL_BIRU);\n                            onShowToast('Memakai Stempel Biru Resmi!');\n                          }}\n                          className=\"bg-[#EBF3FB] hover:bg-[#DBE9F8] text-[#2B6CB0] border border-[#2B6CB0]/30 font-bold text-xs px-3 py-2 rounded-xl transition cursor-pointer\"\n                          title=\"Pakai contoh stempel lingkaran biru resmi\"\n                        >\n                          🔵 Contoh Biru\n                        </button>\n\n                        {stempelUrlInput && (\n                          <button\n                            type=\"button\"\n                            onClick={() => {\n                              setStempelUrlInput('');\n                              onShowToast('Foto stempel berhasil dihapus');\n                            }}\n                            className=\"text-[#C23B3B] hover:bg-red-50 p-2 rounded-xl transition cursor-pointer text-xs font-bold flex items-center gap-1\"\n                          >\n                            <Trash2 className=\"w-4 h-4\" />\n                            <span>Hapus</span>\n                          </button>\n                        )}\n                      </div>\n                    </div>\n                  </div>\n                </div>\n              </div>\n\n              {/* Modal Footer Buttons */}\n              <div className=\"p-3 sm:p-4 bg-[#FAF8F5] border-t border-[#EDE8DC] flex flex-wrap items-center justify-between gap-2 shrink-0\">\n                <button\n                  type=\"button\"\n                  onClick={() => {\n                    if (confirm('Reset profil sekolah dan foto stempel resmi kembali ke standar?')) {\n                      const defaultInfo = {\n                        nama: DEFAULT_SEKOLAH_INFO.nama || 'MTs Anwarul Hidayah Babakankeusik',\n                        kepalaSekolah: DEFAULT_SEKOLAH_INFO.kepalaSekolah || 'AHIM, Spd.I',\n                        nipKepalaSekolah: DEFAULT_SEKOLAH_INFO.nipKepalaSekolah || '198201012005011002',\n                        npsn: DEFAULT_SEKOLAH_INFO.npsn || '20253812',\n                        stempelUrl: '',\n                        logoUrl: ''\n                      };\n                      setNamaSekolahInput(defaultInfo.nama);\n                      setKepalaSekolahInput(defaultInfo.kepalaSekolah);\n                      setNipKepalaSekolahInput(defaultInfo.nipKepalaSekolah);\n                      setNpsnInput(defaultInfo.npsn);\n                      setStempelUrlInput('');\n                      setLogoUrlInput('');\n                      onSaveSekolahInfo(defaultInfo);\n                      onShowToast('Profil sekolah & stempel di-reset ke standar!');\n                    }\n                  }}\n                  className=\"bg-[#C23B3B]/10 hover:bg-[#C23B3B]/20 text-[#C23B3B] font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 cursor-pointer\"\n                >\n                  <RotateCcw className=\"w-4 h-4\" />\n                  <span>Reset ke Standar</span>\n                </button>\n\n                <div className=\"flex items-center gap-2\">\n                  <button\n                    type=\"button\"\n                    onClick={() => setActiveModal(null)}\n                    className=\"px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-[#5B6B7A] bg-[#F4F1E9] hover:bg-[#E1DACB] cursor-pointer transition\"\n                  >\n                    Batal\n                  </button>\n                  <button\n                    type=\"submit\"\n                    className=\"bg-[#1F3D2E] text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl hover:bg-[#193326] transition flex items-center gap-1.5 shadow-xs er text-xs text-[#5B6B7A]\">Belum ada guru terdaftar.</p>\n                ) : (\n                  filteredTeachers.map((g) => (\n                    <TeacherItemRow\n                      key={g.id}\n                      g={g}\n                      onOpenEditModal={handleOpenEditTeacherModal}\n                      onDeleteGuru={handleDeleteGuru}\n                      onUpdateTeacherPhoto={handleUpdateTeacherPhoto}\n                      allEskuls={roster.eskuls || DEFAULT_ESKULS}\n                    />\n                  ))\n                )}\n              </div>\n            </div>\n\n            <div className=\"p-3 sm:p-4 bg-[#FAF8F5] border-t border-[#EDE8DC] flex justify-end shrink-0\">\n              <button\n                type=\"button\"\n                onClick={() => setActiveModal(null)}\n                className=\"bg-[#1F3D2E] text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl hover:bg-[#193326] transition shadow-xs cursor-pointer\"\n              >\n                Selesai & Tutup\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* 5. POPUP KELOLA EKSTRAKURIKULER */}\n      {activeModal === 'eskul' && (\n        <div className=\"fixed inset-0 bg-black/60 backdrop-blur-xs z-[60] flex items-center justify-center p-0 sm:p-4 animate-in fade-in duration-150\">\n          <div className=\"bg-white w-full h-full sm:h-[92vh] sm:max-w-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden\">\n            {/* Header Modal Full Screen */}\n            <div className=\"bg-[#1F3D2E] text-white p-4 sm:p-5 flex items-center justify-between shrink-0 shadow-sm\">\n              <div className=\"flex items-center gap-3\">\n                <div className=\"w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-lg\">\n                  <Trophy className=\"w-5 h-5 text-amber-300\" />\n                </div>\n                <div>\n                  <h3 className=\"font-ka CB] rounded-lg px-2.5 py-1 text-xs text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                              />\n                            </div>\n                            <div>\n                              <label className=\"text-[10px] font-semibold text-[#5B6B7A] block mb-0.5\">Keterangan / Catatan</label>\n                              <input\n                                type=\"text\"\n                                value={editEskulPembina}\n                                onChange={(e) => setEditEskulPembina(e.target.value)}\n                                className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2.5 py-1 text-xs text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                              />\n                            </div>\n                            <div className=\"flex gap-2\">\n                              <div className=\"w-1/2\">\n                                <label className=\"text-[10px] font-semibold text-[#5B6B7A] block mb-0.5\">Hari Jadwal</label>\n                                <select\n                                  value={editEskulHari}\n                                  onChange={(e) => setEditEskulHari(e.target.value)}\n                                  className=\"w-full bg-white border border-[#E1DACB] rounded-lg px-2 py-1 text-xs font-bold text-[#22303F] focus:outline-none focus:border-[#1F3D2E]\"\n                                >\n                                  {HARI_DALAM_SEMINGGU.map(h => (\n                                    <option key={h} value={h}>{h}</option>\n                                  ))}\n                                </select>\n                              </div>\n                              <div className=\"w-1/2\">\n                                <label className=\"text-[10px] font-semibold text-[#5B6B7A] block mb-0.5\">Jam Kegiatan</label>\n                                <input\n                                  type=\"text\"\n
